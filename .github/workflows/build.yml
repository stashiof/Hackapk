name: Build ShikhoMax Stable

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools & Setup
        run: |
          pip install gdown pillow
          wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APKS from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=16T63abl_dBwnS3DJ3LlornCLle_khN20" -O my_app.apks

      - name: Merge to Universal APK
        run: |
          java -jar APKEditor.jar m -i my_app.apks -o merged.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Stable Bypass FLAG_SECURE (Enable Screenshots)
        run: |
          echo "Patching FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Apply Master SMALI Hacks (Python Automated)
        run: |
          python3 - << 'EOF'
          import os
          import re

          smali_dir = "decompiled_app"

          # টার্গেট ফাইলগুলোর লিস্ট
          click_listeners = ["cga.smali", "cia.smali", "d22.smali", "de.smali", "dia.smali", "fo5.smali", "gha.smali", "il9.smali", "kj7.smali", "gv4.smali", "h61.smali"]
          parsers_full = ["zd6.smali", "er6.smali", "mx6.smali", "qse.smali"]
          parsers_date = ["b46.smali", "lu5.smali", "qt5.smali"]

          for root, dirs, files in os.walk(smali_dir):
              for file in files:
                  if not file.endswith(".smali"):
                      continue

                  filepath = os.path.join(root, file)
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()

                  original_content = content

                  # ১. কোর্স স্ট্যাটাস পেইড বানানো
                  if file == "m7c.smali":
                      patch = "    sget-object v9, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v10, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v11, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v12, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v16, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v17, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n\n    new-instance v3, Lh7c;"
                      content = content.replace("    new-instance v3, Lh7c;", patch)
                  
                  elif file == "d8c.smali":
                      patch = "    sget-object v1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v2, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v3, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v4, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v5, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n\n    new-instance v0, Lu7c;"
                      content = content.replace("    new-instance v0, Lu7c;", patch)

                  # ২. "ফ্রিতে শেখা শেষ" ব্যাজ সরানো (২০৯৯ সাল)
                  elif file in parsers_date:
                      # check-cast vX, Ljava/lang/String; খুঁজে বের করে তার নিচে ডেট বসানো
                      content = re.sub(r'(check-cast (v\d+), Ljava/lang/String;)', r'\1\n\n    const-string \2, "2099-12-31T17:59:59Z"', content)

                  # ৩. রুটিনের ভিডিও আনলক করা
                  elif file == "n8.smali":
                      content = content.replace('const-string v2, "ReadOnly"', 'const-string v2, "Full"')

                  # ৪. Click Listeners হ্যাক (ReadOnly -> Unlocked)
                  elif file in click_listeners:
                      content = re.sub(r'const-string (v\d+), "ReadOnly"', r'const-string \1, "Unlocked"', content)

                  # ৫. GraphQL Parsers (Full)
                  elif file in parsers_full:
                      content = re.sub(r'(check-cast (v\d+), Ljava/lang/String;)', r'\1\n\n    const-string \2, "Full"', content)

                  # ৬. দ্য আল্টিমেট মাস্টার হ্যাক (h30.smali) - Access Level & Download Limit
                  elif file == "h30.smali":
                      content = re.sub(r'\.method public final d\(\)Ljava/lang/String;.*?\.end method',
                                       '.method public final d()Ljava/lang/String;\n    .registers 2\n\n    const-string v0, "Full"\n\n    return-object v0\n.end method',
                                       content, flags=re.DOTALL)
                      
                      content = re.sub(r'\.method public final y\(\)I.*?\.end method',
                                       '.method public final y()I\n    .registers 2\n\n    const/16 v0, 0x270f\n\n    return v0\n.end method',
                                       content, flags=re.DOTALL)

                  # ফাইলে কোনো পরিবর্তন হলে সেটি সেভ করা
                  if content != original_content:
                      with open(filepath, 'w', encoding='utf-8') as f:
                          f.write(content)
                      print(f"✅ Successfully Patched: {file}")
          EOF

      - name: Change App Name to ShikhoMax
        run: |
          echo "Updating App Name to ShikhoMax..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ShikhoMax<\/string>/g' {} +

      - name: Force Override Adaptive Icons & Compress
        run: |
          python3 - << 'EOF'
          import os
          import shutil
          from PIL import Image

          icon_src = "app_icon.png"
          if not os.path.exists(icon_src):
              print("app_icon.png not found! Skipping icon override.")
              exit(0)

          for root, dirs, files in os.walk("decompiled_app/res"):
              if "anydpi" in root:
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".xml"):
                          os.remove(os.path.join(root, f))
                          print(f"Removed adaptive XML: {f}")

          orig = Image.open(icon_src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": (48, 48),
              "mipmap-hdpi": (72, 72),
              "mipmap-xhdpi": (96, 96),
              "mipmap-xxhdpi": (144, 144),
              "mipmap-xxxhdpi": (192, 192),
              "drawable": (192, 192)
          }

          for folder, size in sizes.items():
              dir_path = os.path.join("decompiled_app/res", folder)
              if os.path.exists(dir_path):
                  resized = orig.resize(size, Image.Resampling.LANCZOS)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                      out_file = os.path.join(dir_path, name)
                      resized.save(out_file, format="PNG", optimize=True)
          print("✅ All launcher icons fully replaced and optimized!")
          EOF

      - name: Rebuild Optimized APK
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk --use-aapt2

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload ShikhoMax APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Stable-APK
          path: output_signed/*.apk
