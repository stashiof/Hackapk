name: Build ShikhoMax Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools & Setup
        run: |
          pip install gdown pillow
          wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APKS from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=16T63abl_dBwnS3DJ3LlornCLle_khN20" -O my_app.apks

      - name: Merge to Universal APK
        run: |
          java -jar APKEditor.jar m -i my_app.apks -o merged.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Stable Bypass FLAG_SECURE (Enable Screenshots)
        run: |
          echo "Patching FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Change App Name to ShikhoMax
        run: |
          echo "Updating App Name to ShikhoMax..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ShikhoMax<\/string>/g' {} +

      - name: 🚀 Mega Advanced Fix - UI Done Markers + Full Terminal Logging
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys

          print("=== Starting MEGA Advanced Fixes ===")

          # ----- 1. DEBUG MODE ON (ডিবাগ টার্মিনালের জন্য) -----
          print("\n[1] Enabling debuggable flag in AndroidManifest.xml...")
          manifest_path = "decompiled_app/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8', errors='ignore') as f:
                  mani = f.read()
              # debuggable true সেট করা
              mani = re.sub(r'android:debuggable="false"', 'android:debuggable="true"', mani)
              if 'android:debuggable="true"' not in mani:
                  mani = re.sub(r'(<application\s+)', r'\1 android:debuggable="true" ', mani)
              with open(manifest_path, 'w', encoding='utf-8', errors='ignore') as f:
                  f.write(mani)
              print("   ✅ AndroidManifest.xml patched for debuggable=true")

          # ----- 2. UI কনফার্মেশন: ডাউনলোড ও কোর্স অপশনে "✅ Done" লেখা -----
          print("\n[2] Adding UI Confirmation '✅ Done' to Download & Course options...")
          for root, dirs, files in os.walk("decompiled_app/res"):
              if "values" in root:
                  for file in files:
                      if file == "strings.xml":
                          path = os.path.join(root, file)
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          # শুধু পুরো শব্দটিকে রিপ্লেস করা হচ্ছে (কেস সংবেদনশীল)
                          content = re.sub(r'>Download<', r'>Download ✅ Done<', content, flags=re.IGNORECASE)
                          content = re.sub(r'>Courses<', r'>Courses ✅ Done<', content, flags=re.IGNORECASE)
                          content = re.sub(r'>Enroll<', r'>Enroll ✅ Done<', content, flags=re.IGNORECASE)
                          with open(path, 'w', encoding='utf-8', errors='ignore') as f:
                              f.write(content)
                          print(f"   ✅ Patched strings in: {path}")

          # ----- 3. ডাউনলোড লিমিট ফিক্স (৩ -> ১০০) -----
          print("\n[3] Removing Download Limit (3 -> 100)...")
          for root, dirs, files in os.walk("decompiled_app/res/values"):
              for file in files:
                  if file == "integers.xml":
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      content = re.sub(r'>\s*3\s*<', r'>100<', content)
                      with open(path, 'w', encoding='utf-8', errors='ignore') as f:
                          f.write(content)
                      print(f"   Patched integers.xml: {path}")

          download_files = []
          for root, dirs, files in os.walk("decompiled_app/smali"):
              for file in files:
                  if "download" in file.lower():
                      download_files.append(os.path.join(root, file))
          for path in download_files:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = re.sub(r'(const/4\s+v[0-9]+,\s*)0x3\b', r'\g<1>0x64', content)
              content = re.sub(r'(const/16\s+v[0-9]+,\s*)0x3\b', r'\g<1>0x64', content)
              with open(path, 'w', encoding='utf-8', errors='ignore') as f:
                  f.write(content)
          print(f"   Patched {len(download_files)} download-related smali files.")

          # ----- 4. কোর্স নেভিগেশন ফিক্স (অ্যাডমিশনের লজিক কপি) -----
          print("\n[4] Fixing Home Screen Course Navigation...")
          public_path = "decompiled_app/res/values/public.xml"
          admission_id = None
          course_id = None
          if os.path.exists(public_path):
              with open(public_path, 'r', encoding='utf-8', errors='ignore') as f:
                  pub_content = f.read()
              match = re.search(r'<public type="id" name="([^"]*admission[^"]*)" id="(0x[0-9a-f]+)"', pub_content, re.IGNORECASE)
              if not match:
                  match = re.search(r'<public type="id" name="([^"]*enroll[^"]*)" id="(0x[0-9a-f]+)"', pub_content, re.IGNORECASE)
              if match:
                  admission_id = match.group(2)
                  print(f"   Found Admission ID: {admission_id}")
              match = re.search(r'<public type="id" name="([^"]*course[^"]*)" id="(0x[0-9a-f]+)"', pub_content, re.IGNORECASE)
              if match:
                  course_id = match.group(2)
                  print(f"   Found Course ID: {course_id}")

          main_activity_files = []
          for root, dirs, files in os.walk("decompiled_app/smali"):
              for file in files:
                  if "mainactivity" in file.lower() or "homeactivity" in file.lower():
                      main_activity_files.append(os.path.join(root, file))
          if not main_activity_files:
              for root, dirs, files in os.walk("decompiled_app/smali"):
                  for file in files:
                      if "activity" in file.lower():
                          main_activity_files.append(os.path.join(root, file))

          patched_nav = False
          for main_path in main_activity_files:
              if patched_nav: break
              with open(main_path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              new_lines = []
              i = 0
              admission_block = None
              while i < len(lines):
                  line = lines[i]
                  if admission_id and admission_id in line:
                      temp_lines = [line]
                      j = i + 1
                      while j < len(lines) and not re.search(r'(const|sget|if-|:cond_|:goto_|return)', lines[j]):
                          temp_lines.append(lines[j])
                          j += 1
                      if j < len(lines) and (lines[j].strip().startswith(":") or "return" in lines[j]):
                          temp_lines.append(lines[j])
                          j += 1
                      admission_block = "".join(temp_lines)
                      print(f"   ✅ Captured Admission logic block ({len(temp_lines)} lines).")
                      i = j
                      continue
                  if course_id and course_id in line:
                      if admission_block:
                          lines[i] = admission_block
                          print(f"   ✅ Replaced Course logic with Admission logic.")
                          patched_nav = True
                          break
                      else:
                          lines[i] = f"# {course_id} PATCHED (Fallback)\n"
                          patched_nav = True
                          break
                  i += 1
              if patched_nav:
                  with open(main_path, 'w', encoding='utf-8', errors='ignore') as f:
                      f.writelines(lines)
                  print(f"   ✅ Successfully patched navigation in {main_path}")

          if not patched_nav:
              print("   ⚠️ Fallback: Applying null-check bypass in Course activities...")
              for root, dirs, files in os.walk("decompiled_app/smali"):
                  for file in files:
                      if "course" in file.lower() and ("activity" in file.lower() or "detail" in file.lower()):
                          path = os.path.join(root, file)
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          content = re.sub(r'(invoke-virtual.*getIntExtra.*)\n(\s*)(if-eqz\s+v[0-9]+,)', r'\1\n\2const/4 v0, 0x1\n\2if-nez v0,', content)
                          content = re.sub(r'(invoke-virtual.*getStringExtra.*)\n(\s*)(if-eqz\s+v[0-9]+,)', r'\1\n\2const-string v0, "default"\n\2if-nez v0,', content)
                          with open(path, 'w', encoding='utf-8', errors='ignore') as f:
                              f.write(content)
                          print(f"   ✅ Applied fallback to {path}")

          # ----- 5. টার্মিনাল লগিং ইনজেক্ট (প্রত্যেক ক্লিকে Logcat দেখাবে) -----
          print("\n[5] Injecting Terminal Logcat into all click handlers...")
          injected_count = 0
          for root, dirs, files in os.walk("decompiled_app/smali"):
              for file in files:
                  path = os.path.join(root, file)
                  with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  
                  # শুধুমাত্র onClick বা onOptionsItemSelected মেথড থাকলেই ইনজেক্ট করব
                  if '.method' in content and ('onClick' in content or 'onOptionsItemSelected' in content):
                      lines = content.split('\n')
                      new_lines = []
                      injected = False
                      for line in lines:
                          new_lines.append(line)
                          if '.registers' in line and not injected:
                              match = re.search(r'\.registers\s+(\d+)', line)
                              if match:
                                  count = int(match.group(1)) + 2
                                  new_lines[-1] = f'.registers {count}'
                              # Log ইনজেক্ট করুন (লগ ট্যাগ "ShikhoMaxDebug")
                              new_lines.append('    const-string v10, "ShikhoMaxDebug"')
                              new_lines.append('    const-string v11, "🔥 Clicked: ' + os.path.basename(path).replace('.smali', '') + '"')
                              new_lines.append('    invoke-static {v10, v11}, Landroid/util/Log;->d(Ljava/lang/String;Ljava/lang/String;)I')
                              injected = True
                              injected_count += 1
                      if injected:
                          with open(path, 'w', encoding='utf-8', errors='ignore') as f:
                              f.write('\n'.join(new_lines))
                          print(f'   ✅ Injected log into {os.path.basename(path)}')

          print(f"\n=== All fixes applied! Total {injected_count} click handlers injected with Terminal logs. ===")
          EOF

      - name: Force Override Adaptive Icons & Compress
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          icon_src = "app_icon.png"
          if not os.path.exists(icon_src):
              print("app_icon.png not found! Skipping icon change.")
              exit(0)

          for root, dirs, files in os.walk("decompiled_app/res"):
              if "anydpi" in root:
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".xml"):
                          os.remove(os.path.join(root, f))
                          print(f"Removed adaptive XML: {f}")

          orig = Image.open(icon_src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": (48, 48), "mipmap-hdpi": (72, 72),
              "mipmap-xhdpi": (96, 96), "mipmap-xxhdpi": (144, 144),
              "mipmap-xxxhdpi": (192, 192), "drawable": (192, 192)
          }

          for folder, size in sizes.items():
              dir_path = os.path.join("decompiled_app/res", folder)
              if os.path.exists(dir_path):
                  resized = orig.resize(size, Image.Resampling.LANCZOS)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                      out_file = os.path.join(dir_path, name)
                      resized.save(out_file, format="PNG", optimize=True)
          print("All launcher icons replaced!")
          EOF

      - name: Rebuild Optimized APK
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk --use-aapt2

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload ShikhoMax APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Stable-APK
          path: output_signed/*.apk
