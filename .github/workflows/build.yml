      # ⭐ নতুন পপআপ ইনজেকশন (রোবাস্ট ও ফ্লেক্সিবল ভার্সন) ⭐
      - name: Inject Custom Welcome Popup (Robust)
        run: |
          python3 - << 'EOF'
          import os
          import re
          import glob
          import xml.etree.ElementTree as ET

          manifest_path = "decompiled_app/AndroidManifest.xml"
          if not os.path.exists(manifest_path):
              print("Manifest not found!")
              exit(0)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          ns = {'android': 'http://schemas.android.com/apk/res/android'}

          package = root.get('package')
          if not package:
              print("Package not found!")
              exit(0)

          launcher_activity = None
          for activity in root.findall('application/activity'):
              intent_filter = activity.find('intent-filter')
              if intent_filter is not None:
                  for action in intent_filter.findall('action'):
                      if action.get('{http://schemas.android.com/apk/res/android}name') == 'android.intent.action.MAIN':
                          launcher_activity = activity.get('{http://schemas.android.com/apk/res/android}name')
                          break
                  if launcher_activity:
                      break

          if not launcher_activity:
              print("No LAUNCHER activity found!")
              exit(0)

          if launcher_activity.startswith('.'):
              smali_rel = f"{package.replace('.', '/')}{launcher_activity}.smali"
          else:
              smali_rel = f"{launcher_activity.replace('.', '/')}.smali"

          smali_files = glob.glob(f"decompiled_app/smali*/{smali_rel}")
          if not smali_files:
              print(f"Smali file not found for {smali_rel}")
              exit(0)
          smali_path = smali_files[0]
          print(f"Found LAUNCHER activity smali: {smali_path}")

          with open(smali_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          dialog_smali = [
              '    new-instance v3, Landroid/app/AlertDialog$Builder;\n',
              '    invoke-direct {v3, p0}, Landroid/app/AlertDialog$Builder;-><init>(Landroid/content/Context;)V\n',
              '    const-string v4, "🎉 Welcome to ShikhoMax"\n',
              '    invoke-virtual {v3, v4}, Landroid/app/AlertDialog$Builder;->setTitle(Ljava/lang/CharSequence;)Landroid/app/AlertDialog$Builder;\n',
              '    const-string v4, "Thank you for choosing ShikhoMax!\\n\\nEnjoy all premium features unlocked."\n',
              '    invoke-virtual {v3, v4}, Landroid/app/AlertDialog$Builder;->setMessage(Ljava/lang/CharSequence;)Landroid/app/AlertDialog$Builder;\n',
              '    const-string v4, "Get Started"\n',
              '    const/4 v5, 0x0\n',
              '    invoke-virtual {v3, v4, v5}, Landroid/app/AlertDialog$Builder;->setPositiveButton(Ljava/lang/CharSequence;Landroid/content/DialogInterface$OnClickListener;)Landroid/app/AlertDialog$Builder;\n',
              '    invoke-virtual {v3}, Landroid/app/AlertDialog$Builder;->create()Landroid/app/AlertDialog;\n',
              '    move-result-object v3\n',
              '    invoke-virtual {v3}, Landroid/app/AlertDialog;->show()V\n',
          ]

          # ফ্লেক্সিবল মেথড সার্চ লজিক
          method_start = -1
          method_end = -1
          inside_method = False
          
          # ১. প্রথমে onCreate খুঁজি
          for i, line in enumerate(lines):
              if line.strip().startswith('.method') and ' onCreate(' in line:
                  method_start = i
                  inside_method = True
              if inside_method and line.strip().startswith('.end method'):
                  method_end = i
                  break

          # ২. না পেলে onStart বা onResume খুঁজি
          if method_start == -1:
              for i, line in enumerate(lines):
                  if line.strip().startswith('.method') and (' onStart(' in line or ' onResume(' in line):
                      method_start = i
                      inside_method = True
                  if inside_method and line.strip().startswith('.end method'):
                      method_end = i
                      break

          # ৩. তাও না পেলে <init> (কনস্ট্রাক্টর) খুঁজি
          if method_start == -1:
              print("No lifecycle method found (onCreate/onStart/onResume)!")
              for i, line in enumerate(lines):
                  if line.strip().startswith('.method') and (' <init>(' in line or ' constructor' in line):
                      method_start = i
                      inside_method = True
                  if inside_method and line.strip().startswith('.end method'):
                      method_end = i
                      break

          if method_start == -1:
              print("Failed to find any method to inject!")
              exit(1)

          injected = False
          for i in range(method_start, method_end):
              if 'invoke-super' in lines[i] and ('onCreate' in lines[i] or 'onStart' in lines[i] or 'onResume' in lines[i]):
                  insert_pos = i + 1
                  lines = lines[:insert_pos] + dialog_smali + lines[insert_pos:]
                  injected = True
                  break

          if not injected:
              for i in range(method_end-1, method_start-1, -1):
                  if 'return-void' in lines[i]:
                      lines = lines[:i] + dialog_smali + lines[i:]
                      injected = True
                      break

          if not injected:
              print("Could not find a suitable injection point!")
              exit(1)

          for i, line in enumerate(lines):
              if line.strip().startswith('.locals'):
                  parts = line.split()
                  if len(parts) > 1:
                      try:
                          current = int(parts[1])
                          if current < 6:
                              lines[i] = f'    .locals 6\n'
                              print(f'Updated .locals from {current} to 6')
                      except:
                          pass
                  break

          with open(smali_path, 'w', encoding='utf-8') as f:
              f.writelines(lines)

          print('✅ Custom welcome popup injected successfully!')
          EOF
