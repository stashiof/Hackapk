name: Decompile & Extract Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Tools
        run: |
          pip install gdown
          wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APKS from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=16T63abl_dBwnS3DJ3LlornCLle_khN20" -O my_app.apks

      - name: Merge to Universal APK
        run: |
          java -jar APKEditor.jar m -i my_app.apks -o merged.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Generate Java-like source with jadx
        run: |
          wget -O jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -o jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          ./jadx/bin/jadx -d java_source decompiled_app/ --show-bad-code

      - name: Zip decompiled source
        run: |
          zip -r smali_code.zip decompiled_app/smali/
          zip -r java_source.zip java_source/

      - name: Upload decompiled source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Decompiled-Source
          path: |
            smali_code.zip
            java_source.zip

      - name: Rebuild APK (no patches)
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-APK
          path: output_signed/*.apk
