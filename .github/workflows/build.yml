name: PlayStore to Universal APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App Package Name'
        required: true
        default: 'tech.shikho.android'

jobs:
  build:
    runs-on: ubuntu-latest  # পুনরায় ubuntu-latest ব্যবহার করা হলো

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools
        run: |
          wget -q -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          wget -q -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          # ⭐ লাইব্রেরি এরর ফিক্স: gnu এর বদলে musl ভার্সন ব্যবহার করা হলো
          wget -q -O apkeep https://github.com/EFForg/apkeep/releases/download/0.8.0/apkeep-x86_64-unknown-linux-musl
          chmod +x apkeep

      - name: Download App from Play Store
        run: |
          echo "Downloading ${{ github.event.inputs.package_name }} from Google Play..."
          mkdir downloaded_apks
          ./apkeep -a ${{ github.event.inputs.package_name }} downloaded_apks/

      - name: Process and Merge to Universal APK
        run: |
          cd downloaded_apks
          count=$(ls *.apk 2>/dev/null | wc -l)
          
          if [ "$count" -gt "1" ]; then
            echo "Split APKs detected ($count files). Packing to .apks..."
            zip -q -r ../app.apks *
            cd ..
            echo "Merging APKS to Universal APK..."
            java -jar APKEditor.jar m -i app.apks -o universal.apk
          elif [ "$count" -eq "1" ]; then
            echo "Single APK detected. No merge required."
            cd ..
            cp downloaded_apks/*.apk universal.apk
          else
            echo "Error: No APK files found! The app might be paid or blocked."
            exit 1
          fi

      - name: Sign Universal APK
        run: |
          echo "Signing the APK..."
          java -jar uber-apk-signer.jar -a universal.apk -o output_signed/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-APK-${{ github.event.inputs.package_name }}
          path: output_signed/*.apk
