name: PlayStore to Universal APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App Package Name'
        required: true
        default: 'tech.shikho.android'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Download Tools (Via Cargo)
        run: |
          curl -fSL -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          curl -fSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          echo "Installing apkeep via Cargo..."
          cargo install apkeep

      - name: Download App (All Architectures)
        run: |
          echo "Downloading ${{ github.event.inputs.package_name }} (Full Bundle)..."
          mkdir -p downloaded_apks
          # -d apkpure ব্যবহার করে প্লে স্টোরের বদলে সরাসরি ফুল বান্ডেল নামানো হচ্ছে
          apkeep -d apkpure -a ${{ github.event.inputs.package_name }} downloaded_apks/

      - name: Process and Merge to Universal APK
        run: |
          echo "Checking downloaded files..."
          
          apks_file=$(find downloaded_apks -type f -name "*.apks" | head -n 1)
          xapk_file=$(find downloaded_apks -type f -name "*.xapk" | head -n 1)
          apk_count=$(find downloaded_apks -type f -name "*.apk" | wc -l)
          
          if [ -n "$apks_file" ]; then
            echo "APKS bundle detected. Merging..."
            java -jar APKEditor.jar m -i "$apks_file" -o universal.apk
          elif [ -n "$xapk_file" ]; then
            echo "XAPK bundle detected. Merging..."
            java -jar APKEditor.jar m -i "$xapk_file" -o universal.apk
          elif [ "$apk_count" -gt "1" ]; then
            echo "Multiple Split APKs detected ($apk_count). Zipping and merging..."
            cd downloaded_apks
            zip -q -r ../app.apks $(find . -name "*.apk")
            cd ..
            java -jar APKEditor.jar m -i app.apks -o universal.apk
          elif [ "$apk_count" -eq "1" ]; then
            echo "Single APK detected."
            find downloaded_apks -name "*.apk" -exec cp {} universal.apk \;
          else
            echo "Error: No APK files found."
            exit 1
          fi

      - name: Sign Universal APK
        run: |
          echo "Signing the APK..."
          java -jar uber-apk-signer.jar -a universal.apk -o output_signed/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-APK-${{ github.event.inputs.package_name }}
          path: output_signed/*.apk
