name: Build ShikhoMax Stable (Dual APKs)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App Package Name'
        required: true
        default: 'tech.shikho.android'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Tools & Setup
        run: |
          pip install pillow
          curl -fSL -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          curl -fSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -fSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          echo "Installing apkeep via Cargo..."
          cargo install apkeep

      - name: Download App from Play Store
        run: |
          echo "Downloading ${{ github.event.inputs.package_name }} from Google Play..."
          mkdir -p downloaded_apks
          apkeep -a ${{ github.event.inputs.package_name }} downloaded_apks/

      - name: Process and Merge to Universal APK
        run: |
          echo "Checking downloaded files..."
          apks_file=$(find downloaded_apks -type f -name "*.apks" | head -n 1)
          xapk_file=$(find downloaded_apks -type f -name "*.xapk" | head -n 1)
          apk_count=$(find downloaded_apks -type f -name "*.apk" | wc -l)
          
          if [ -n "$apks_file" ]; then
            java -jar APKEditor.jar m -i "$apks_file" -o merged.apk
          elif [ -n "$xapk_file" ]; then
            java -jar APKEditor.jar m -i "$xapk_file" -o merged.apk
          elif [ "$apk_count" -gt "1" ]; then
            cd downloaded_apks
            zip -q -r ../app.apks $(find . -name "*.apk")
            cd ..
            java -jar APKEditor.jar m -i app.apks -o merged.apk
          elif [ "$apk_count" -eq "1" ]; then
            find downloaded_apks -name "*.apk" -exec cp {} merged.apk \;
          else
            echo "Error: No APK files found."
            exit 1
          fi

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Apply Common Mods (Name, Images, FLAG_SECURE)
        run: |
          # 1. Update App Name
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's|<string name="app_name"[^>]*>.*</string>|<string name="app_name">ShikhoMax</string>|g' {} +
          
          # 2. Bypass FLAG_SECURE (Screenshot unlock)
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Apply App Icons & Onboarding Images
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          # 1. Onboarding Images
          onboarding_images = ["new_onboarding_img_1.png", "new_onboarding_img_2.png"]
          for img_name in onboarding_images:
              if os.path.exists(img_name):
                  orig = Image.open(img_name).convert("RGBA")
                  optimized_img = orig.convert("P", palette=Image.ADAPTIVE, colors=256)
                  replaced = False
                  for root, dirs, files in os.walk("decompiled_app/res"):
                      if img_name in files:
                          target_path = os.path.join(root, img_name)
                          optimized_img.save(target_path, format="PNG", optimize=True)
                          replaced = True
                  if not replaced:
                      fallback_path = os.path.join("decompiled_app/res/drawable", img_name)
                      os.makedirs(os.path.dirname(fallback_path), exist_ok=True)
                      optimized_img.save(fallback_path, format="PNG", optimize=True)

          # 2. App Icons
          icon_src = "app_icon.png"
          if os.path.exists(icon_src):
              for root, dirs, files in os.walk("decompiled_app/res"):
                  if "anydpi" in root:
                      for f in files:
                          if "ic_launcher" in f and f.endswith(".xml"):
                              os.remove(os.path.join(root, f))
              orig = Image.open(icon_src).convert("RGBA")
              sizes = {"mipmap-mdpi": (48, 48), "mipmap-hdpi": (72, 72), "mipmap-xhdpi": (96, 96), "mipmap-xxhdpi": (144, 144), "mipmap-xxxhdpi": (192, 192), "drawable": (192, 192)}
              for folder, size in sizes.items():
                  dir_path = os.path.join("decompiled_app/res", folder)
                  if os.path.exists(dir_path):
                      resized = orig.resize(size, Image.Resampling.LANCZOS)
                      for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                          out_file = os.path.join(dir_path, name)
                          resized.save(out_file, format="PNG", optimize=True)
          EOF

      - name: Apply Master Hack (Course, Badge, Routine & Listeners)
        run: |
          echo "Applying Core Hacks..."
          
          # Step 1: Course Status
          find decompiled_app -name "m7c.smali" -exec sed -i 's|new-instance v3, Lh7c;|    sget-object v9, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v10, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v11, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v12, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v16, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v17, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n\n    new-instance v3, Lh7c;|g' {} +
          find decompiled_app -name "d8c.smali" -exec sed -i 's|new-instance v0, Lu7c;|    sget-object v1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v2, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v3, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    sget-object v4, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    sget-object v5, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n\n    new-instance v0, Lu7c;|g' {} +
          
          # Step 2: Badge Extender
          find decompiled_app -name "b46.smali" -exec sed -i 's|check-cast v7, Ljava/lang/String;|check-cast v7, Ljava/lang/String;\n\n    const-string v7, "2099-12-31T17:59:59Z"|g' {} +
          find decompiled_app -name "lu5.smali" -exec sed -i 's|check-cast v7, Ljava/lang/String;|check-cast v7, Ljava/lang/String;\n\n    const-string v7, "2099-12-31T17:59:59Z"|g' {} +
          find decompiled_app -name "qt5.smali" -exec sed -i 's|check-cast v0, Ljava/lang/String;|check-cast v0, Ljava/lang/String;\n\n    const-string v0, "2099-12-31T17:59:59Z"|g' {} +
          
          # Step 3: Routine Video Fix
          find decompiled_app -name "n8.smali" -exec sed -i 's|"ReadOnly"|"Full"|g' {} +
          
          # Step 4: Click Listeners (Targeted 11 Files)
          FILES="cga.smali cia.smali d22.smali de.smali dia.smali fo5.smali gha.smali il9.smali kj7.smali gv4.smali h61.smali"
          for file in $FILES; do
            find decompiled_app -name "$file" -exec sed -i 's|"ReadOnly"|"Unlocked"|g' {} +
          done

          # Step 5: Live Class Parsers
          find decompiled_app -name "zd6.smali" -exec sed -i 's|check-cast \(v[0-9]*\), Ljava/lang/String;|check-cast \1, Ljava/lang/String;\n\n    const-string \1, "Full"|g' {} +
          find decompiled_app -name "er6.smali" -exec sed -i 's|check-cast \(v[0-9]*\), Ljava/lang/String;|check-cast \1, Ljava/lang/String;\n\n    const-string \1, "Full"|g' {} +
          find decompiled_app -name "mx6.smali" -exec sed -i 's|check-cast \(v[0-9]*\), Ljava/lang/String;|check-cast \1, Ljava/lang/String;\n\n    const-string \1, "Full"|g' {} +
          find decompiled_app -name "qse.smali" -exec sed -i 's|check-cast \(v[0-9]*\), Ljava/lang/String;|check-cast \1, Ljava/lang/String;\n\n    const-string \1, "Full"|g' {} +

      - name: Build APK 1 (Original Package)
        run: |
          echo "Building ShikhoMax (Original Package)..."
          java -jar apktool.jar b decompiled_app -o ShikhoMax_Original_Pkg_unsigned.apk --use-aapt2

      - name: Prepare Cloned App (tech.shikhomax.android)
        run: |
          echo "Modifying AndroidManifest.xml for Cloned Version..."
          # কোর প্যাকেজ নেম পরিবর্তন
          sed -i 's/package="tech.shikho.android"/package="tech.shikhomax.android"/g' decompiled_app/AndroidManifest.xml
          # কনফ্লিক্ট এড়াতে প্রোভাইডার অথরিটি পরিবর্তন (FileProvider, InitProvider ইত্যাদি)
          sed -i 's/tech.shikho.android.fileprovider/tech.shikhomax.android.fileprovider/g' decompiled_app/AndroidManifest.xml
          sed -i 's/tech.shikho.android.FacebookInitProvider/tech.shikhomax.android.FacebookInitProvider/g' decompiled_app/AndroidManifest.xml
          # ব্যাকআপ হিসেবে বাকি সব অথরিটিতে গ্লোবাল চেঞ্জ
          sed -i 's/authorities="tech.shikho.android/authorities="tech.shikhomax.android/g' decompiled_app/AndroidManifest.xml

      - name: Build APK 2 (Cloned Package)
        run: |
          echo "Building ShikhoMax (Cloned Package)..."
          java -jar apktool.jar b decompiled_app -o ShikhoMax_Clone_Pkg_unsigned.apk --use-aapt2

      - name: Sign Both APKs
        run: |
          echo "Signing both APKs..."
          java -jar uber-apk-signer.jar -a ShikhoMax_Original_Pkg_unsigned.apk -o output_signed/
          java -jar uber-apk-signer.jar -a ShikhoMax_Clone_Pkg_unsigned.apk -o output_signed/

      - name: Upload Dual APKs
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Dual-APKs
          path: output_signed/*.apk
