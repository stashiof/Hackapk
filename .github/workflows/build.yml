name: PlayStore to Universal APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App Package Name'
        required: true
        default: 'tech.shikho.android'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Tools & Setup Environment
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          # APKEditor ও Signer ডাউনলোড
          curl -fSL -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          curl -fSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          # Protobuf কনফ্লিক্ট ফিক্স এবং gplaycli ইনস্টল
          python3 -m pip install --upgrade pip
          pip install "protobuf<=3.20.3"
          pip install gplaycli

      - name: Download App from Play Store
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          echo "Downloading ${{ github.event.inputs.package_name }} from Google Play..."
          mkdir -p downloaded_apks
          # --splits আর্গুমেন্টটি রিমুভ করা হয়েছে
          gplaycli -d ${{ github.event.inputs.package_name }} -f downloaded_apks/ || true

      - name: Process and Merge to Universal APK
        run: |
          cd downloaded_apks
          count=$(ls *.apk 2>/dev/null | wc -l)
          
          if [ "$count" -gt "1" ]; then
            echo "Split APKs detected ($count files). Packing to .apks..."
            zip -q -r ../app.apks *
            cd ..
            echo "Merging APKS to Universal APK..."
            java -jar APKEditor.jar m -i app.apks -o universal.apk
          elif [ "$count" -eq "1" ]; then
            echo "Single APK detected. No merge required."
            cd ..
            cp downloaded_apks/*.apk universal.apk
          else
            echo "Error: Failed to download APKs. App might require authentication or region lock."
            exit 1
          fi

      - name: Sign Universal APK
        run: |
          echo "Signing the APK..."
          java -jar uber-apk-signer.jar -a universal.apk -o output_signed/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-APK-${{ github.event.inputs.package_name }}
          path: output_signed/*.apk
