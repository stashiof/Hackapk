name: Rebrand to ShikhoMax and Patch Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools & Setup
        run: |
          pip install gdown pillow
          wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APKS from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=16T63abl_dBwnS3DJ3LlornCLle_khN20" -O my_app.apks

      - name: Merge to Single Universal APK
        run: |
          java -jar APKEditor.jar m -i my_app.apks -o merged.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Stable Bypass FLAG_SECURE (Enable Screenshots)
        run: |
          echo "Applying stable patch for FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Change App Name to ShikhoMax
        run: |
          echo "Updating App Name to ShikhoMax..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ShikhoMax<\/string>/g' {} +

      - name: Safe Package Name & Authority Update
        run: |
          python3 - << 'EOF'
          import re

          manifest_file = "decompiled_app/AndroidManifest.xml"
          with open(manifest_file, "r", encoding="utf-8") as f:
              xml = f.read()

          match = re.search(r'package="([^"]+)"', xml)
          if match:
              old_pkg = match.group(1)
              new_pkg = "com.shikhomaxfm.app"
              print(f"Targeting: {old_pkg} -> {new_pkg}")

              # ডট দিয়ে শুরু হওয়া রিলেটিভ ক্লাস নামগুলোকে ফুল-ক্লাস পাথে কনভার্ট করা (ক্র্যাশ রোধ করতে)
              def fix_component_names(tag, text):
                  pattern = rf'(<{tag}[^>]*?android:name=")(\.[^"]+)(")'
                  return re.sub(pattern, rf'\g<1>{old_pkg}\g<2>\g<3>', text)

              for tag in ['activity', 'service', 'receiver', 'provider']:
                  xml = fix_component_names(tag, xml)

              # প্যাকেজ আইডি এবং অথোরিটি পরিবর্তন
              xml = re.sub(r'package="[^"]+"', f'package="{new_pkg}"', xml, count=1)
              xml = xml.replace(f'android:authorities="{old_pkg}', f'android:authorities="{new_pkg}')
              xml = xml.replace(f'{old_pkg}.provider', f'{new_pkg}.provider')
              xml = xml.replace(f'{old_pkg}.fileprovider', f'{new_pkg}.fileprovider')

              with open(manifest_file, "w", encoding="utf-8") as f:
                  f.write(xml)
              print("AndroidManifest safely updated without breaking class references!")
          EOF

      - name: Optimize & Replace App Icons
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          icon_src = "app_icon.png"
          if not os.path.exists(icon_src):
              print("app_icon.png not found!")
              exit(0)

          # বড় ইমেজকে অপটিমাইজ ও কম্প্রেস করা (20-30 KB কোয়ালিটি)
          orig_img = Image.open(icon_src).convert("RGBA")

          # সব mipmap ও drawable ফোল্ডারে নির্দিষ্ট সাইজে রিসাইজ করে বসানো
          res_dir = "decompiled_app/res"
          size_map = {
              "mdpi": (48, 48),
              "hdpi": (72, 72),
              "xhdpi": (96, 96),
              "xxhdpi": (144, 144),
              "xxxhdpi": (192, 192)
          }

          replaced = 0
          for root, dirs, files in os.walk(res_dir):
              folder_name = os.path.basename(root)
              for file in files:
                  name_lower = file.lower()
                  # আইকন বা লঞ্চার ফাইল ডিটেক্ট করা
                  if ("ic_launcher" in name_lower or "icon" in name_lower or "logo" in name_lower) and (file.endswith(".png") or file.endswith(".webp")):
                      target_path = os.path.join(root, file)
                      
                      # ফোল্ডারের ডেনসিটি অনুযায়ী পারফেক্ট সাইজ নির্ধারণ
                      target_size = (192, 192) # ডিফল্ট
                      for density, dims in size_map.items():
                          if density in folder_name:
                              target_size = dims
                              break
                      
                      # রিসাইজ এবং সেভ
                      resized_img = orig_img.resize(target_size, Image.Resampling.LANCZOS)
                      resized_img.save(target_path, format="PNG", optimize=True)
                      replaced += 1

          print(f"Total {replaced} icons optimized and replaced with high clarity and low size!")
          EOF

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk --use-aapt2

      - name: Sign Rebranded APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload ShikhoMax APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Universal-APK
          path: output_signed/*.apk
