name: ShikhoMax Download Limit Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools
        run: |
          pip install gdown
          wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APKS
        run: |
          gdown "https://drive.google.com/uc?id=16T63abl_dBwnS3DJ3LlornCLle_khN20" -O my_app.apks

      - name: Merge to Universal APK
        run: |
          java -jar APKEditor.jar m -i my_app.apks -o merged.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Set Debuggable & App Name
        run: |
          # Manifest debuggable true
          sed -i 's/android:debuggable="false"/android:debuggable="true"/g' decompiled_app/AndroidManifest.xml
          if ! grep -q 'android:debuggable="true"' decompiled_app/AndroidManifest.xml; then
            sed -i 's/<application /<application android:debuggable="true" /g' decompiled_app/AndroidManifest.xml
          fi
          # App Name পরিবর্তন
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ShikhoMax<\/string>/g' {} +

      - name: 🔥 Fix Download Limit (3 → 100) DIRECT PATCH
        run: |
          echo "Searching for Lh30.smali and patching y() method..."
          
          # Lh30.smali ফাইলটি খুঁজে বের করি
          LH30_FILE=$(find decompiled_app -name "Lh30.smali" | head -n 1)
          
          if [ -n "$LH30_FILE" ]; then
            echo "Found Lh30.smali at: $LH30_FILE"
            
            # y() মেথড খুঁজে 3 কে 100 করি
            sed -i '/\.method public y()I/,/\.end method/ s/const\/4 v0, 0x3/const\/16 v0, 0x64/g' "$LH30_FILE"
            sed -i '/\.method public y()I/,/\.end method/ s/const\/16 v0, 0x3/const\/16 v0, 0x64/g' "$LH30_FILE"
            
            echo "✅ Lh30.smali patched successfully!"
          else
            echo "⚠️ Lh30.smali not found directly. Searching in all smali files..."
            
            # যদি সরাসরি না পাওয়া যায়, তাহলে সব smali ফাইলে y() মেথড খুঁজি
            find decompiled_app -name "*.smali" -exec grep -l "\.method public y()I" {} \; | while read file; do
              echo "Found y() method in: $file"
              sed -i '/\.method public y()I/,/\.end method/ s/const\/4 v0, 0x3/const\/16 v0, 0x64/g' "$file"
              sed -i '/\.method public y()I/,/\.end method/ s/const\/16 v0, 0x3/const\/16 v0, 0x64/g' "$file"
            done
            echo "✅ Patched all y() methods found."
          fi

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Fixed-APK
          path: output_signed/*.apk
