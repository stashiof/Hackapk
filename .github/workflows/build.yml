name: Pro-Level Universal & Clone APK Builder

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App Package Name (e.g., com.facebook.lite)'
        required: true
        default: 'tech.shikho.android'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_TOOLS: '34.0.0' # Using the latest Android SDK Build Tools

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Tools & SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/apkeep
            /usr/local/lib/android/sdk/build-tools/
          key: build-tools-cache-${{ runner.os }}

      - name: Install System Dependencies & apkeep
        run: |
          sudo apt-get update && sudo apt-get install -y zip unzip apktool
          if ! command -v apkeep &> /dev/null; then
            cargo install apkeep
          fi
          # Ensure Android Build Tools are accessible
          echo "export PATH=\$PATH:$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" >> $GITHUB_ENV

      - name: Download App from Play Store
        run: |
          mkdir -p raw_apks
          apkeep -a ${{ github.event.inputs.package_name }} raw_apks/

      - name: Process App Bundles to Universal APK
        run: |
          # Download APKEditor only for merging split APKs
          curl -fSL -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          
          if ls raw_apks/*.apks 1> /dev/null 2>&1 || ls raw_apks/*.xapk 1> /dev/null 2>&1; then
            BUNDLE=$(ls raw_apks/*.apks raw_apks/*.xapk 2>/dev/null | head -n 1)
            java -jar APKEditor.jar m -i "$BUNDLE" -o base_universal.apk
          elif [ $(ls raw_apks/*.apk | wc -l) -gt 1 ]; then
            cd raw_apks && zip -q -r ../app.apks *.apk && cd ..
            java -jar APKEditor.jar m -i app.apks -o base_universal.apk
          else
            cp raw_apks/*.apk base_universal.apk
          fi

      - name: Advanced Decompile & Smali Patching
        run: |
          apktool d base_universal.apk -o decoded_apk -f
          
          ORIG_PKG="${{ github.event.inputs.package_name }}"
          CLONE_PKG="${ORIG_PKG}.proclone"
          ORIG_PATH="${ORIG_PKG//./\/}"
          CLONE_PATH="${CLONE_PKG//./\/}"
          
          echo "Patching AndroidManifest.xml..."
          sed -i "s/package=\"$ORIG_PKG\"/package=\"$CLONE_PKG\"/g" decoded_apk/AndroidManifest.xml
          sed -i -r 's/android:authorities="([^"]*)"/android:authorities="\1.proclone"/g' decoded_apk/AndroidManifest.xml
          sed -i -r 's/android:name="([^"]*\.provider\.[^"]*)"/android:name="\1_proclone"/g' decoded_apk/AndroidManifest.xml
          
          echo "Executing Deep Smali Text Replacement (Multithreaded)..."
          find decoded_apk -type f -name "*.smali" | xargs -n 50 -P $(nproc) sed -i "s|L$ORIG_PATH|L$CLONE_PATH|g"
          find decoded_apk -type f -name "*.smali" | xargs -n 50 -P $(nproc) sed -i "s|\"$ORIG_PKG\"|\"$CLONE_PKG\"|g"

      - name: Rebuild Clone APK with AAPT2
        run: |
          apktool b decoded_apk -o unaligned_clone.apk --use-aapt2

      - name: Generate Custom Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass "android123" -keypass "android123" -dname "CN=Pro Dev, OU=Modding, O=GitHub, L=Dhaka, S=Dhaka, C=BD"

      - name: Zipalign (Memory Optimization)
        run: |
          $ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign -p -f 4 unaligned_clone.apk aligned_clone.apk

      - name: Sign APK (apksigner)
        run: |
          $ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android123 --key-pass pass:android123 --out Final_Pro_Clone.apk aligned_clone.apk

      - name: Upload Pro Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Clone-${{ github.event.inputs.package_name }}
          path: Final_Pro_Clone.apk
