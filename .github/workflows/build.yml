name: Rebrand to ShikhoMax and Patch Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools & Setup
        run: |
          pip install gdown
          # APKEditor ডাউনলোড
          wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          # Apktool ডাউনলোড
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          # APK Signer ডাউনলোড
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APKS from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=16T63abl_dBwnS3DJ3LlornCLle_khN20" -O my_app.apks

      - name: Merge to Single Universal APK
        run: |
          java -jar APKEditor.jar m -i my_app.apks -o merged.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Stable Bypass FLAG_SECURE (Enable Screenshots)
        run: |
          echo "Applying stable patch for FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Change App Name to ShikhoMax
        run: |
          echo "Updating App Name to ShikhoMax..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ShikhoMax<\/string>/g' {} +

      - name: Change Package Name to com.shikhomaxfm.app
        run: |
          echo "Updating Package Name and Provider Authorities..."
          python3 - << 'EOF'
          import re

          manifest_path = "decompiled_app/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          # পুরাতন প্যাকেজ নেম বের করা
          match = re.search(r'package="([^"]+)"', content)
          if match:
              old_pkg = match.group(1)
              print(f"Old Package Name: {old_pkg}")
              new_pkg = "com.shikhomaxfm.app"
              
              # Manifest-এ প্যাকেজ এবং অথোরিটি পরিবর্তন
              content = content.replace(f'package="{old_pkg}"', f'package="{new_pkg}"')
              content = content.replace(old_pkg, new_pkg)
              
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Manifest updated successfully.")
          EOF

      - name: Update App Logo
        run: |
          if [ -f "app_icon.png" ]; then
            echo "Replacing App Icons..."
            find decompiled_app/res/mipmap* -type f -name "ic_launcher*.png" -exec cp -f app_icon.png {} +
            find decompiled_app/res/drawable* -type f -name "ic_launcher*.png" -exec cp -f app_icon.png {} +
            find decompiled_app/res/mipmap* -type f -name "ic_launcher*.webp" -exec cp -f app_icon.png {} +
            find decompiled_app/res/drawable* -type f -name "ic_launcher*.webp" -exec cp -f app_icon.png {} +
          else
            echo "app_icon.png not found in repository root, skipping icon update."
          fi

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk --use-aapt2

      - name: Sign Rebranded APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload ShikhoMax APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Universal-APK
          path: output_signed/*.apk
