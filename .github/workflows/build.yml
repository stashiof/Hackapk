name: Build ShikhoMax Stable

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'App Package Name'
        required: true
        default: 'tech.shikho.android'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Tools & Setup
        run: |
          pip install pillow
          curl -fSL -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          curl -fSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -fSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          echo "Installing apkeep via Cargo..."
          cargo install apkeep

      - name: Download App from Play Store
        run: |
          echo "Downloading ${{ github.event.inputs.package_name }} from Google Play..."
          mkdir -p downloaded_apks
          apkeep -a ${{ github.event.inputs.package_name }} downloaded_apks/

      - name: Process and Merge to Universal APK
        run: |
          echo "Checking downloaded files..."
          
          apks_file=$(find downloaded_apks -type f -name "*.apks" | head -n 1)
          xapk_file=$(find downloaded_apks -type f -name "*.xapk" | head -n 1)
          apk_count=$(find downloaded_apks -type f -name "*.apk" | wc -l)
          
          # আউটপুট ফাইলের নাম merged.apk দেওয়া হয়েছে যাতে পরের ধাপে ডিকম্পাইল হতে পারে
          if [ -n "$apks_file" ]; then
            echo "APKS bundle detected. Merging..."
            java -jar APKEditor.jar m -i "$apks_file" -o merged.apk
          elif [ -n "$xapk_file" ]; then
            echo "XAPK bundle detected. Merging..."
            java -jar APKEditor.jar m -i "$xapk_file" -o merged.apk
          elif [ "$apk_count" -gt "1" ]; then
            echo "Multiple Split APKs detected ($apk_count). Zipping and merging..."
            cd downloaded_apks
            zip -q -r ../app.apks $(find . -name "*.apk")
            cd ..
            java -jar APKEditor.jar m -i app.apks -o merged.apk
          elif [ "$apk_count" -eq "1" ]; then
            echo "Single APK detected."
            find downloaded_apks -name "*.apk" -exec cp {} merged.apk \;
          else
            echo "Error: No APK files found."
            exit 1
          fi

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: Stable Bypass FLAG_SECURE (Enable Screenshots)
        run: |
          echo "Patching FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Change App Name to ShikhoMax
        run: |
          echo "Updating App Name to ShikhoMax..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ShikhoMax<\/string>/g' {} +

      - name: Force Override Adaptive Icons & Compress
        run: |
          python3 - << 'EOF'
          import os
          import shutil
          from PIL import Image

          icon_src = "app_icon.png"
          if not os.path.exists(icon_src):
              print("app_icon.png not found!")
              exit(0)

          # অ্যাডাপ্টিভ আইকন এক্সএমএল রিমুভ করা যাতে ফোর্সফুলি নতুন PNG শো করে
          for root, dirs, files in os.walk("decompiled_app/res"):
              if "anydpi" in root:
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".xml"):
                          os.remove(os.path.join(root, f))
                          print(f"Removed adaptive XML: {f}")

          # ইমেজ অপটিমাইজেশন (২০-৩০ কেবি এবং হাই কোয়ালিটি)
          orig = Image.open(icon_src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": (48, 48),
              "mipmap-hdpi": (72, 72),
              "mipmap-xhdpi": (96, 96),
              "mipmap-xxhdpi": (144, 144),
              "mipmap-xxxhdpi": (192, 192),
              "drawable": (192, 192)
          }
          for folder, size in sizes.items():
              dir_path = os.path.join("decompiled_app/res", folder)
              if os.path.exists(dir_path):
                  resized = orig.resize(size, Image.Resampling.LANCZOS)
                  for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                      out_file = os.path.join(dir_path, name)
                      resized.save(out_file, format="PNG", optimize=True)
                      print("All launcher icons fully replaced and optimized!")
          EOF

      - name: Rebuild Optimized APK
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk --use-aapt2

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload ShikhoMax APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Stable-APK
          path: output_signed/*.apk
