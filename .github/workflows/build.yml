name: ShikhoMax Ultimate Auto Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools
        run: |
          pip install gdown
          wget -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APKS
        run: |
          gdown "https://drive.google.com/uc?id=16T63abl_dBwnS3DJ3LlornCLle_khN20" -O my_app.apks

      - name: Merge to Universal APK
        run: |
          java -jar APKEditor.jar m -i my_app.apks -o merged.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d merged.apk -o decompiled_app -f

      - name: 🔥 ULTIMATE AUTO PATCH (Loop until all 3's are replaced)
        run: |
          python3 - << 'EOF'
          import os, re, sys

          def patch_strings():
              changes = False
              for root, dirs, files in os.walk("decompiled_app/res"):
                  for file in files:
                      if file == "strings.xml":
                          path = os.path.join(root, file)
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          # খুঁজে বের করি ডাউনলোড বা লিমিট সম্পর্কিত স্ট্রিং
                          if re.search(r'(?i)(download|limit|ডাউনলোড|লিমিট|ভিডিও)', content):
                              # সব 3 কে 100 করি (শুধু মাত্র সংখ্যা)
                              new_content = re.sub(r'(?<![0-9])3(?![0-9])', '100', content)
                              if new_content != content:
                                  with open(path, 'w', encoding='utf-8') as f:
                                      f.write(new_content)
                                  print(f"✅ Patched strings: {path}")
                                  changes = True
              return changes

          def patch_smali():
              changes = False
              for root, dirs, files in os.walk("decompiled_app/smali"):
                  for file in files:
                      if not file.endswith(".smali"):
                          continue
                      path = os.path.join(root, file)
                      with open(path, 'r', errors='ignore') as f:
                          content = f.read()
                      # শুধুমাত্র ডাউনলোড বা লিমিট সম্পর্কিত ফাইল
                      if not re.search(r'(?i)(download|limit|ডাউনলোড|লিমিট)', content):
                          continue
                      new_content = content
                      # 1. const/4 vX, 0x3 -> const/4 vX, 0x64
                      new_content = re.sub(r'(const/4\s+v[0-9]+,\s*)0x3\b', r'\g<1>0x64', new_content)
                      # 2. const/16 vX, 0x3 -> const/16 vX, 0x64
                      new_content = re.sub(r'(const/16\s+v[0-9]+,\s*)0x3\b', r'\g<1>0x64', new_content)
                      # 3. সরাসরি সংখ্যা 3 (যেমন if-ge vX, 0x3)
                      new_content = re.sub(r'(if-[gl][te]\s+v[0-9]+,\s*)0x3\b', r'\g<1>0x64', new_content)
                      # 4. '3' as a standalone number in other contexts (like iput)
                      new_content = re.sub(r'(iput\s+v[0-9]+,\s*p[0-9]+,\s*L[^;]*;->[^:]*:I\s+const/4\s+v[0-9]+,\s*)0x3', r'\g<1>0x64', new_content)
                      if new_content != content:
                          with open(path, 'w') as f:
                              f.write(new_content)
                          print(f"✅ Patched smali: {path}")
                          changes = True
              return changes

          # লুপ চালাই যতক্ষণ না কোনো পরিবর্তন হয়
          iteration = 0
          while True:
              iteration += 1
              print(f"\n=== Iteration {iteration} ===")
              changed_strings = patch_strings()
              changed_smali = patch_smali()
              if not changed_strings and not changed_smali:
                  print("✅ No more changes found. Patch complete.")
                  break
              if iteration > 20:
                  print("⚠️ Maximum iterations reached. Exiting loop.")
                  break
          EOF

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled_app -o shikhomax_unsigned.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks shikhomax_unsigned.apk -o output_signed/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikhoMax-Ultimate-Fix
          path: output_signed/*.apk
