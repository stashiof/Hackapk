name: Original Drive PDF Downloader

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: 'Google Drive Link দিন'
        required: true
        type: string
      file_name:
        description: 'ফাইলের নাম (যেমন: book.pdf)'
        required: false
        default: 'original_file.pdf'
        type: string

jobs:
  download-original:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install gdown playwright requests img2pdf
          playwright install chromium
          playwright install-deps chromium

      - name: Download Original File
        env:
          DRIVE_URL: ${{ github.event.inputs.drive_url }}
          FILE_NAME: ${{ github.event.inputs.file_name }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os, re, sys, time, base64, subprocess, requests, img2pdf
          from playwright.sync_api import sync_playwright

          raw_url = os.environ["DRIVE_URL"].strip()
          out_name = os.environ["FILE_NAME"].strip()
          if not out_name.endswith(".pdf"):
              out_name += ".pdf"

          match = re.search(r'(?:/d/|id=)([a-zA-Z0-9_-]{25,})', raw_url)
          if not match:
              print("সঠিক Google Drive লিংক দিন!")
              sys.exit(1)

          file_id = match.group(1)

          # ধাপ ১: সরাসরি file_id দিয়ে আসল ফাইল ডাউনলোডের চেষ্টা
          print("ধাপ ১: সরাসরি আসল ফাইল ডাউনলোডের চেষ্টা করা হচ্ছে...")
          subprocess.run(["gdown", file_id, "-O", out_name], check=False)

          if os.path.exists(out_name) and os.path.getsize(out_name) > 5000:
              with open(out_name, "rb") as f:
                  header = f.read(5)
              if header == b"%PDF-":
                  print("সফল! সরাসরি আসল PDF ফাইল ডাউনলোড হয়েছে।")
              else:
                  os.remove(out_name)

          # ধাপ ২: View-only হলে ব্রাউজার ভিউয়ার থেকে সব পেজ এক্সট্রাক্ট করা
          if not os.path.exists(out_name):
              print("ডাউনলোড রেস্ট্রিক্টেড। ভিউয়ার থেকে সব পেজ সংগ্রহ করা হচ্ছে...")
              preview_url = f"https://drive.google.com/file/d/{file_id}/preview"

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(
                      viewport={"width": 1440, "height": 2000},
                      device_scale_factor=2
                  )
                  page = context.new_page()
                  page.goto(preview_url, wait_until="networkidle", timeout=90000)
                  time.sleep(4)

                  last_height = -1
                  same_count = 0
                  for _ in range(300):
                      page.keyboard.press("PageDown")
                      time.sleep(0.5)
                      curr_scroll = page.evaluate("""() => {
                          const divs = Array.from(document.querySelectorAll('div'));
                          const sDiv = divs.find(d => d.scrollHeight > d.clientHeight && d.clientHeight > 400);
                          return sDiv ? sDiv.scrollTop : window.scrollY;
                      }""")
                      if curr_scroll == last_height:
                          same_count += 1
                          if same_count >= 5:
                              break
                      else:
                          same_count = 0
                      last_height = curr_scroll

                  time.sleep(2)
                  base64_images = page.evaluate("""async () => {
                      const imgs = Array.from(document.querySelectorAll('img'))
                          .filter(img => img.src.startsWith('blob:') && img.naturalWidth > 150);
                      imgs.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
                      const results = [];
                      for (const img of imgs) {
                          const canvas = document.createElement('canvas');
                          canvas.width = img.naturalWidth;
                          canvas.height = img.naturalHeight;
                          canvas.getContext('2d').drawImage(img, 0, 0);
                          results.push(canvas.toDataURL('image/jpeg', 0.95).split(',')[1]);
                      }
                      return results;
                  }""")
                  browser.close()

              if not base64_images:
                  print("ব্যর্থ: কোনো পেজ পাওয়া যায়নি। লিংকটি 'Anyone with the link' করা আছে কিনা নিশ্চিত করুন।")
                  sys.exit(1)

              print(f"মোট {len(base64_images)} টি পেজ পাওয়া গেছে। PDF তৈরি হচ্ছে...")
              img_bytes = [base64.b64decode(b) for b in base64_images]
              with open(out_name, "wb") as f:
                  f.write(img2pdf.convert(img_bytes))
              print("সফল! সম্পূর্ণ PDF ডাউনলোড হয়েছে।")

          # টেলিগ্রামে পাঠানো (যদি সেট করা থাকে)
          token = os.environ.get("TG_BOT_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          if token and chat_id and os.path.exists(out_name):
              with open(out_name, "rb") as f:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendDocument",
                      data={"chat_id": chat_id},
                      files={"document": f}
                  )
          EOF

      - name: Upload Original PDF
        uses: actions/upload-artifact@v4
        with:
          name: Original-PDF
          path: "*.pdf"
