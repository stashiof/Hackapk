name: Ultimate App Modder 🚀

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'অ্যাপ কোথা থেকে ডাউনলোড করবেন?'
        required: true
        type: choice
        options:
          - 'PlayStore'
          - 'GoogleDrive'
        default: 'PlayStore'
      app_identifier:
        description: 'Play Store Package Name অথবা Google Drive Link'
        required: true
        type: string
        default: 'tech.shikho.android'
      unlock_premium:
        description: 'সব প্রিমিয়াম ফিচার আনলক করবেন? (Live Class, Routine, etc.)'
        required: true
        type: boolean
        default: true
      bypass_secure:
        description: 'স্ক্রিনশট/রেকর্ড রেস্ট্রিকশন ভাঙতে চান? (FLAG_SECURE)'
        required: true
        type: boolean
        default: true
      change_name:
        description: 'অ্যাপের নাম পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      new_app_name:
        description: 'নতুন অ্যাপের নাম (যদি নাম পরিবর্তন করতে চান)'
        required: false
        type: string
        default: 'Modded App'
      change_icon:
        description: 'অ্যাপের লোগো পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      icon_url:
        description: 'নতুন লোগোর ডিরেক্ট লিংক (PNG ফরম্যাট)'
        required: false
        type: string
      clone_app:
        description: 'ক্লোন অ্যাপ তৈরি করবেন? (আগেরটার পাশাপাশি চালাতে)'
        required: true
        type: boolean
        default: false

jobs:
  build_mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Tools (apkeep, apktool, etc.)
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl zip unzip xmlstarlet
          pip install gdown pillow
          cargo install apkeep
          
          wget -q -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download & Merge to Universal APK
        run: |
          if [ "${{ github.event.inputs.source_type }}" == "PlayStore" ]; then
            echo "Downloading from Play Store..."
            mkdir -p downloaded_apks
            apkeep -a "${{ github.event.inputs.app_identifier }}" downloaded_apks/
            
            apks_file=$(find downloaded_apks -type f -name "*.apks" | head -n 1)
            xapk_file=$(find downloaded_apks -type f -name "*.xapk" | head -n 1)
            apk_count=$(find downloaded_apks -type f -name "*.apk" | wc -l)
            
            if [ -n "$apks_file" ]; then
              java -jar APKEditor.jar m -i "$apks_file" -o universal.apk
            elif [ -n "$xapk_file" ]; then
              java -jar APKEditor.jar m -i "$xapk_file" -o universal.apk
            elif [ "$apk_count" -gt "1" ]; then
              cd downloaded_apks
              zip -q -r ../app.apks $(find . -name "*.apk")
              cd ..
              java -jar APKEditor.jar m -i app.apks -o universal.apk
            elif [ "$apk_count" -eq "1" ]; then
              find downloaded_apks -name "*.apk" -exec cp {} universal.apk \;
            else
              echo "Error: No APK files found."
              exit 1
            fi
          else
            echo "Downloading from Google Drive..."
            gdown "${{ github.event.inputs.app_identifier }}" -O downloaded.apks
            java -jar APKEditor.jar m -i downloaded.apks -o universal.apk
          fi

      - name: Decompile APK
        run: |
          echo "Decompiling APK..."
          java -jar apktool.jar d universal.apk -o decompiled_app -f

      - name: Premium Features Unlock (Absolute Method Override)
        if: ${{ github.event.inputs.unlock_premium == 'true' }}
        run: |
          echo "Overwriting target Smali files with solid byte-level patches..."
          python3 - << 'EOF'
          import os

          for root, dirs, files in os.walk("decompiled_app"):
              for file in files:
                  filepath = os.path.join(root, file)

                  if file == "n4.smali":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace('iput-boolean v13, v0, Ln4;->l:Z', 'const/4 v13, 0x0\n    iput-boolean v13, v0, Ln4;->l:Z')
                      c = c.replace('iput-boolean v14, v0, Ln4;->m:Z', 'const/4 v14, 0x0\n    iput-boolean v14, v0, Ln4;->m:Z')
                      c = c.replace('iput-boolean v4, v0, Ln4;->p:Z', 'const/4 v4, 0x0\n    iput-boolean v4, v0, Ln4;->p:Z')
                      c = c.replace('iput-boolean v1, v0, Ln4;->t:Z', 'const/4 v1, 0x1\n    iput-boolean v1, v0, Ln4;->t:Z')
                      c = c.replace('iput-boolean v1, v0, Ln4;->u:Z', 'const/4 v1, 0x0\n    iput-boolean v1, v0, Ln4;->u:Z')
                      c = c.replace('iput-boolean v1, v0, Ln4;->w:Z', 'const/4 v1, 0x1\n    iput-boolean v1, v0, Ln4;->w:Z')
                      c = c.replace('iput-boolean v1, v0, Ln4;->G:Z', 'const/4 v1, 0x0\n    iput-boolean v1, v0, Ln4;->G:Z')
                      with open(filepath, "w") as f:
                          f.write(c)
                      print("-> Patched n4.smali")

                  elif file == "u7c.smali":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace('iput-object p1, p0, Lu7c;->a:Ljava/lang/Boolean;', 'sget-object p1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object p1, p0, Lu7c;->a:Ljava/lang/Boolean;')
                      c = c.replace('iput-object p4, p0, Lu7c;->d:Ljava/lang/Boolean;', 'sget-object p4, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object p4, p0, Lu7c;->d:Ljava/lang/Boolean;')
                      with open(filepath, "w") as f:
                          f.write(c)
                      print("-> Patched u7c.smali")

                  elif file == "h7c.smali":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace('iput-object p6, p0, Lh7c;->f:Ljava/lang/Boolean;', 'sget-object p6, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object p6, p0, Lh7c;->f:Ljava/lang/Boolean;')
                      c = c.replace('iput-object p7, p0, Lh7c;->g:Ljava/lang/Boolean;', 'sget-object p7, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object p7, p0, Lh7c;->g:Ljava/lang/Boolean;')
                      c = c.replace('iput-object p13, p0, Lh7c;->m:Ljava/lang/Boolean;', 'sget-object p13, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object p13, p0, Lh7c;->m:Ljava/lang/Boolean;')
                      with open(filepath, "w") as f:
                          f.write(c)
                      print("-> Patched h7c.smali")

                  elif file == "slh.smali":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace('const v2, 0x7f0a0387\n\n    const/4 v3, 0x0\n\n    invoke-virtual {v0, v2, v1, v3}, Lama;->e(ILandroid/os/Bundle;Lema;)V\n\n    return-void', 'return-void')
                      c = c.replace('iget-boolean v3, v2, Lz19;->o0:Z', 'const/4 v3, 0x0')
                      c = c.replace('iget-boolean v2, v0, Lz19;->o0:Z', 'const/4 v2, 0x0')
                      with open(filepath, "w") as f:
                          f.write(c)
                      print("-> Patched slh.smali")

                  elif file == "d43.smali":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace('invoke-virtual {v2, v9}, Lh30;->C(Ljava/lang/String;)V', 'const-string v9, "full"\n    invoke-virtual {v2, v9}, Lh30;->C(Ljava/lang/String;)V')
                      with open(filepath, "w") as f:
                          f.write(c)
                      print("-> Patched d43.smali")

                  elif file in ["er6.smali", "zd6.smali"]:
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace('check-cast v25, Ljava/lang/String;', 'const-string v25, "full"')
                      c = c.replace('check-cast v4, Ljava/lang/String;', 'const-string v4, "full"')
                      c = c.replace('check-cast v2, Ljava/lang/String;', 'const-string v2, "full"')
                      c = c.replace('check-cast v1, Ljava/lang/String;', 'const-string v1, "full"')
                      with open(filepath, "w") as f:
                          f.write(c)
                      print(f"-> Patched {file}")

                  elif file in ["b46.smali", "lu5.smali"]:
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace('check-cast v6, Ljava/lang/Boolean;', 'sget-object v6, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                      with open(filepath, "w") as f:
                          f.write(c)
                      print(f"-> Patched {file}")

                  elif file == "h30.smali":
                      with open(filepath, "r") as f:
                          lines = f.readlines()
                      new_lines = []
                      in_d = False
                      in_y = False
                      for line in lines:
                          if ".method public final d()Ljava/lang/String;" in line:
                              in_d = True
                              new_lines.append(line)
                              new_lines.append("    .registers 2\n    const-string v0, \"full\"\n    return-object v0\n.end method\n")
                              continue
                          if in_d:
                              if ".end method" in line:
                                  in_d = False
                              continue

                          if ".method public final y()I" in line:
                              in_y = True
                              new_lines.append(line)
                              new_lines.append("    .registers 2\n    const v0, 0x7fffffff\n    return v0\n.end method\n")
                              continue
                          if in_y:
                              if ".end method" in line:
                                  in_y = False
                              continue

                          new_lines.append(line)

                      with open(filepath, "w") as f:
                          f.writelines(new_lines)
                      print("-> Patched h30.smali")

          for root, dirs, files in os.walk("decompiled_app"):
              for file in files:
                  if file.endswith(".smali"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r") as f:
                          data = f.read()

                      orig = data
                      data = data.replace('->l:Z', '->l:Z\n    const/4 v0, 0x0')
                      data = data.replace('->w:Z', '->w:Z\n    const/4 v0, 0x1')
                      data = data.replace('Lu7c;->a:Ljava/lang/Boolean;', 'Lu7c;->a:Ljava/lang/Boolean;\n    sget-object v0, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                      data = data.replace('Lu7c;->d:Ljava/lang/Boolean;', 'Lu7c;->d:Ljava/lang/Boolean;\n    sget-object v0, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;')
                      data = data.replace('Lh7c;->f:Ljava/lang/Boolean;', 'Lh7c;->f:Ljava/lang/Boolean;\n    sget-object v0, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                      data = data.replace('Lh7c;->g:Ljava/lang/Boolean;', 'Lh7c;->g:Ljava/lang/Boolean;\n    sget-object v0, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;')

                      if data != orig:
                          with open(filepath, "w") as f:
                              f.write(data)
          EOF

      - name: Patch FLAG_SECURE (Screenshot/Record Enable)
        if: ${{ github.event.inputs.bypass_secure == 'true' }}
        run: |
          echo "Bypassing FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/invoke-virtual {.*}, Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Change App Name
        if: ${{ github.event.inputs.change_name == 'true' }}
        run: |
          echo "Changing App Name to ${{ github.event.inputs.new_app_name }}..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.new_app_name }}<\/string>/g' {} +

      - name: Clone App (Allow multiple installs)
        if: ${{ github.event.inputs.clone_app == 'true' }}
        run: |
          echo "Cloning App..."
          MANIFEST="decompiled_app/AndroidManifest.xml"
          ORIGINAL_PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST" | head -n 1)
          if [ -n "$ORIGINAL_PKG" ]; then
            NEW_PKG="${ORIGINAL_PKG}.clone"
            sed -i "s/package=\"$ORIGINAL_PKG\"/package=\"$NEW_PKG\"/g" "$MANIFEST"
            sed -i "s/android:authorities=\"/android:authorities=\"clone./g" "$MANIFEST"
            echo "Package changed from $ORIGINAL_PKG to $NEW_PKG"
          else
            echo "Warning: Could not find original package name!"
          fi

      - name: Change App Icon
        if: ${{ github.event.inputs.change_icon == 'true' }}
        run: |
          echo "Downloading and applying new Icon..."
          wget -q -O app_icon.png "${{ github.event.inputs.icon_url }}"
          
          python3 - << 'EOF'
          import os
          from PIL import Image
          
          icon_src = "app_icon.png"
          if not os.path.exists(icon_src):
              print("Icon download failed or invalid URL.")
              exit(0)
              
          for root, dirs, files in os.walk("decompiled_app/res"):
              if "anydpi" in root:
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".xml"):
                          os.remove(os.path.join(root, f))
                          
          try:
              orig = Image.open(icon_src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": (48, 48), "mipmap-hdpi": (72, 72),
                  "mipmap-xhdpi": (96, 96), "mipmap-xxhdpi": (144, 144),
                  "mipmap-xxxhdpi": (192, 192), "drawable": (192, 192)
              }
              
              for folder, size in sizes.items():
                  dir_path = os.path.join("decompiled_app/res", folder)
                  if os.path.exists(dir_path):
                      resized = orig.resize(size, Image.Resampling.LANCZOS)
                      for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                          resized.save(os.path.join(dir_path, name), format="PNG", optimize=True)
              print("Icon replaced successfully!")
          except Exception as e:
              print(f"Error processing image: {e}")
          EOF

      - name: Rebuild Optimized APK
        run: |
          echo "Rebuilding APK..."
          java -jar apktool.jar b decompiled_app -o modded_unsigned.apk --use-aapt2

      - name: Sign Modded APK
        run: |
          echo "Signing APK..."
          java -jar uber-apk-signer.jar -a modded_unsigned.apk -o output_signed/

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Modded-APK
          path: output_signed/*.apk
