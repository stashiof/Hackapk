name: Ultimate App Modder 🚀

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'অ্যাপ কোথা থেকে ডাউনলোড করবেন?'
        required: true
        type: choice
        options:
          - 'GoogleDrive'
          - 'PlayStore'
        default: 'GoogleDrive'
      app_identifier:
        description: 'Google Drive Link অথবা Play Store Package Name'
        required: true
        type: string
        default: 'tech.shikho.android'
      unlock_premium:
        description: 'সব প্রিমিয়াম ফিচার আনলক করবেন?'
        required: true
        type: boolean
        default: true
      bypass_secure:
        description: 'স্ক্রিনশট/রেকর্ড রেস্ট্রিকশন ভাঙতে চান?'
        required: true
        type: boolean
        default: true
      change_name:
        description: 'অ্যাপের নাম পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      new_app_name:
        description: 'নতুন অ্যাপের নাম'
        required: false
        type: string
        default: 'Modded App'
      change_icon:
        description: 'অ্যাপের লোগো পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      icon_url:
        description: 'নতুন লোগোর লিংক (Direct URL বা Google Drive Link)'
        required: false
        type: string
      change_vectors:
        description: 'কাস্টম গোল্ডেন শিল্ড ভেক্টর লোগো যুক্ত করবেন?'
        required: true
        type: boolean
        default: true
      change_onboarding:
        description: 'অনবোর্ডিং ইমেজ পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      onboarding_img_1:
        description: 'Onboarding Image 1 URL (Direct বা Google Drive)'
        required: false
        type: string
      onboarding_img_2:
        description: 'Onboarding Image 2 URL (Direct বা Google Drive)'
        required: false
        type: string
      onboarding_img_3:
        description: 'Onboarding Image 3 URL (Direct বা Google Drive)'
        required: false
        type: string
      add_welcome_dialog:
        description: 'ওয়েলকাম ও ডিসক্লেমার ডায়ালগ যুক্ত করবেন?'
        required: true
        type: boolean
        default: true
      mod_author:
        description: 'মোডার বা ডেভেলপারের নাম'
        required: false
        type: string
        default: 'Fahim'
      clone_app:
        description: 'ক্লোন অ্যাপ তৈরি করবেন?'
        required: true
        type: boolean
        default: false

jobs:
  build_mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl zip unzip xmlstarlet
          pip install --upgrade gdown pillow requests

          wget -q -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download & Merge APK
        run: |
          if [ "${{ github.event.inputs.source_type }}" == "PlayStore" ]; then
            echo "Installing apkeep..."
            cargo install apkeep
            
            echo "Downloading from Play Store..."
            mkdir -p downloaded_apks
            apkeep -a "${{ github.event.inputs.app_identifier }}" downloaded_apks/
            
            apks_file=$(find downloaded_apks -type f -name "*.apks" | head -n 1)
            xapk_file=$(find downloaded_apks -type f -name "*.xapk" | head -n 1)
            apk_count=$(find downloaded_apks -name "*.apk" | wc -l)
            
            if [ -n "$apks_file" ]; then
              java -jar APKEditor.jar m -i "$apks_file" -o universal.apk
            elif [ -n "$xapk_file" ]; then
              java -jar APKEditor.jar m -i "$xapk_file" -o universal.apk
            elif [ "$apk_count" -gt "1" ]; then
              cd downloaded_apks
              zip -q -r ../app.apks $(find . -name "*.apk")
              cd ..
              java -jar APKEditor.jar m -i app.apks -o universal.apk
            elif [ "$apk_count" -eq "1" ]; then
              find downloaded_apks -name "*.apk" -exec cp {} universal.apk \;
            else
              echo "Error: Play Store থেকে কোনো APK ফাইল পাওয়া যায়নি।"
              exit 1
            fi
          else
            echo "Downloading from Google Drive..."
            python3 - << 'PYEOF'
          import gdown, re, os, sys

          raw_input = """${{ github.event.inputs.app_identifier }}""".strip()
          output = "downloaded_drive_file"

          match = re.search(r'[-\w]{25,}', raw_input)
          if match:
              file_id = match.group(0)
              print(f"Extracted Google Drive File ID: {file_id}")
              gdown.download(id=file_id, output=output, quiet=False)
          else:
              print(f"Downloading directly from URL: {raw_input}")
              gdown.download(url=raw_input, output=output, quiet=False)

          if not os.path.exists(output) or os.path.getsize(output) == 0:
              print("::error::Google Drive থেকে ফাইল নামানো যায়নি। শেয়ার পারমিশন 'Anyone with the link' নিশ্চিত করুন।")
              sys.exit(1)
          PYEOF

            echo "Checking file type..."
            if java -jar APKEditor.jar m -i downloaded_drive_file -o universal.apk; then
              echo "Bundle merged successfully into universal.apk"
            else
              echo "Standard APK detected, copying to universal.apk..."
              cp downloaded_drive_file universal.apk
            fi
          fi

      - name: Decompile APK
        run: |
          echo "Decompiling APK..."
          java -jar apktool.jar d universal.apk -o decompiled_app -f

      - name: Premium Features Unlock (Complete Unified Patch)
        if: ${{ github.event.inputs.unlock_premium == 'true' }}
        run: |
          echo "Applying Unified Smali Patches..."
          python3 - << 'EOF'
          import os, re

          target_files = [
              "slh.smali", "er6.smali", "zd6.smali", "tq6.smali", "sd6.smali",
              "n4.smali", "h7c.smali", "u7c.smali", "h30.smali", "b46.smali",
              "d43.smali", "lu5.smali", "d8c.smali", "m7c.smali", "ejc.smali"
          ]

          for root, dirs, files in os.walk("decompiled_app"):
              for file in files:
                  if file not in target_files: 
                      continue
                  filepath = os.path.join(root, file)
                  with open(filepath, "r", encoding="utf-8") as f:
                      c = f.read()
                  orig = c

                  # 1. slh.smali -> Routing Logic
                  if file == "slh.smali":
                      c = re.sub(
                          r'(iget-boolean ([vp]\d+), ([vp]\d+), Lz19;->o0:Z\s+if-eqz \2, (:cond_\w+))\s+(:cond_\w+)',
                          r'\1\n    return-void\n\n    \5',
                          c
                      )
                      c = re.sub(
                          r'(iget-boolean ([vp]\d+), ([vp]\d+), Lz19;->o0:Z\s+if-eqz \2, :cond_\w+\s+)goto :goto_\w+',
                          r'\1goto :cond_2af',
                          c
                      )
                      c = re.sub(r'if-eqz ([vp]\d+), :cond_23d', r'# bypassed if-eqz \1, :cond_23d', c)
                      c = re.sub(r'if-eqz ([vp]\d+), :cond_2ac', r'# bypassed if-eqz \1, :cond_2ac', c)

                  # 2 & 3. er6.smali, zd6.smali -> Access Level
                  elif file == "er6.smali":
                      c = c.replace('check-cast v4, Ljava/lang/String;', 'const-string v4, "Full"')
                  elif file == "zd6.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/String;', r'const-string \1, "Full"', c, count=1)

                  # 4 & 5. tq6.smali, sd6.smali -> Constructors
                  elif file == "tq6.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Ltq6;->a:Ljava/lang/String;',
                          r'const-string \1, "Full"\n    iput-object \1, \2, Ltq6;->a:Ljava/lang/String;',
                          c
                      )
                  elif file == "sd6.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lsd6;->a:Ljava/lang/String;',
                          r'const-string \1, "Full"\n    iput-object \1, \2, Lsd6;->a:Ljava/lang/String;',
                          c
                      )

                  # 6. n4.smali -> Academic Program Model
                  elif file == "n4.smali":
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->l:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->l:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->m:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->m:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->t:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->t:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->u:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->u:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->v:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->v:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->w:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->w:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->p:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->p:Z', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Ln4;->h:Ljava/lang/String;', r'const-string \1, "Full"\n    iput-object \1, \2, Ln4;->h:Ljava/lang/String;', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Ln4;->g:Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Ln4;->g:Ljava/lang/Boolean;', c)

                  # 7. h7c.smali -> Quarter Model
                  elif file == "h7c.smali":
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->f:Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->f:Ljava/lang/Boolean;', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->g:Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->g:Ljava/lang/Boolean;', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->n:Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->n:Ljava/lang/Boolean;', c)

                  # 8. u7c.smali -> Quarter Pricing Model
                  elif file == "u7c.smali":
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Lu7c;->a:Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lu7c;->a:Ljava/lang/Boolean;', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Lu7c;->d:Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lu7c;->d:Ljava/lang/Boolean;', c)

                  # 9. h30.smali -> AppPreference
                  elif file == "h30.smali":
                      c = re.sub(
                          r'\.method public final d\(\)Ljava/lang/String;.*?\.end method',
                          '.method public final d()Ljava/lang/String;\n    .registers 2\n    const-string v0, "Full"\n    return-object v0\n.end method',
                          c,
                          flags=re.DOTALL
                      )
                      c = re.sub(
                          r'\.method public final y\(\)I.*?\.end method',
                          '.method public final y()I\n    .registers 2\n    const v0, 0x7fffffff\n    return v0\n.end method',
                          c,
                          flags=re.DOTALL
                      )

                  # 10 & 12. b46.smali, lu5.smali -> Active Subscription Deserializers
                  elif file == "b46.smali":
                      c = c.replace('check-cast v6, Ljava/lang/Boolean;', 'sget-object v6, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                  elif file == "lu5.smali":
                      c = c.replace('check-cast v6, Ljava/lang/Boolean;', 'sget-object v6, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')

                  # 11. d43.smali -> Lesson Click Access Level
                  elif file == "d43.smali":
                      c = re.sub(
                          r'invoke-virtual \{([vp]\d+), ([vp]\d+)\}, Lh30;->C\(Ljava/lang/String;\)V',
                          r'const-string \2, "Full"\n    invoke-virtual {\1, \2}, Lh30;->C(Ljava/lang/String;)V',
                          c
                      )

                  # 13 & 14. d8c.smali, m7c.smali -> Course Enrollment Parsers
                  elif file == "d8c.smali":
                      c = c.replace('check-cast v1, Ljava/lang/Boolean;', 'sget-object v1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                      c = c.replace('check-cast v4, Ljava/lang/Boolean;', 'sget-object v4, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;')
                  elif file == "m7c.smali":
                      c = c.replace('check-cast v9, Ljava/lang/Boolean;', 'sget-object v9, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                      c = c.replace('check-cast v10, Ljava/lang/Boolean;', 'sget-object v10, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;')
                      c = c.replace('check-cast v17, Ljava/lang/Boolean;', 'sget-object v17, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;')

                  # 15. ejc.smali -> Profile Quarter Card View Holder
                  elif file in ["ejc.smali", "Lejc.smali"]:
                      c = c.replace('const v6, 0x7f1403d0', 'const v6, 0x7f140047')
                      c = c.replace('const v8, 0x7f0600fd', 'const v8, 0x7f0604fd')
                      c = c.replace('const v6, 0x7f0604dd', 'const v6, 0x7f060547')
                      c = c.replace('const v6, 0x7f0808e7', 'const v6, 0x7f0808e8')

                  if c != orig:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(c)
                      print(f"-> Safely Patched {file}")
          EOF

      - name: Patch FLAG_SECURE (Screenshot/Record Enable)
        if: ${{ github.event.inputs.bypass_secure == 'true' }}
        run: |
          echo "Bypassing FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Change App Name
        if: ${{ github.event.inputs.change_name == 'true' }}
        run: |
          echo "Changing App Name..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.new_app_name }}<\/string>/g' {} +

      - name: Clone App
        if: ${{ github.event.inputs.clone_app == 'true' }}
        run: |
          echo "Cloning App..."
          MANIFEST="decompiled_app/AndroidManifest.xml"
          ORIGINAL_PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST" | head -n 1)
          if [ -n "$ORIGINAL_PKG" ]; then
            NEW_PKG="${ORIGINAL_PKG}.clone"
            sed -i "s/package=\"$ORIGINAL_PKG\"/package=\"$NEW_PKG\"/g" "$MANIFEST"
            sed -i "s/android:authorities=\"/android:authorities=\"clone./g" "$MANIFEST"
          fi

      - name: Replace Brand Vectors (Golden Shield & Emblem)
        if: ${{ github.event.inputs.change_vectors == 'true' }}
        run: |
          echo "Replacing vector drawables with Custom Golden Shield Vector..."
          python3 - << 'EOF'
          import os

          vector_content = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="242dp"
              android:height="290dp"
              android:viewportWidth="400"
              android:viewportHeight="480">

              <!-- ১. শিল্ড বেস — লেয়ারড রেডিয়াল-লুক -->
              <path
                  android:fillColor="#0A0616"
                  android:pathData="M200,20 L350,75 L375,260 L350,400 L200,470 L50,400 L25,260 L50,75 Z" />

              <path android:fillColor="#170B2E" android:fillAlpha="0.9" android:pathData="M200,45 L325,90 L347,255 L325,375 L200,438 L75,375 L53,255 L75,90 Z" />
              <path android:fillColor="#241344" android:fillAlpha="0.85" android:pathData="M200,90 L290,120 L305,255 L290,340 L200,395 L110,340 L95,255 L110,120 Z" />
              <path android:fillColor="#331C5C" android:fillAlpha="0.55" android:pathData="M200,150 L250,168 L258,255 L250,320 L200,355 L150,320 L142,255 L150,168 Z" />

              <path
                  android:strokeColor="#4A2E86"
                  android:strokeWidth="4"
                  android:pathData="M200,26 L342,78 L365,255 L342,392 L200,458 L58,392 L35,255 L58,78 Z" />

              <path android:strokeColor="#B388FF" android:strokeAlpha="0.35" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M130,45 L200,22 L270,45" />
              <path android:strokeColor="#D4BBFF" android:strokeWidth="2.2" android:strokeLineCap="round" android:pathData="M130,45 L200,22 L270,45" />

              <path android:strokeColor="#FFC24B" android:strokeAlpha="0.35" android:strokeWidth="6" android:strokeLineCap="round" android:pathData="M25,260 L50,400 L90,418 M375,260 L350,400 L310,418" />
              <path android:strokeColor="#FFD883" android:strokeWidth="2.6" android:strokeLineCap="round" android:pathData="M25,260 L50,400 L90,418 M375,260 L350,400 L310,418" />

              <path android:fillColor="#B388FF" android:fillAlpha="0.28" android:pathData="M65,92m-7,0a7,7 0 1,1 14,0a7,7 0 1,1 -14,0" />
              <path android:fillColor="#EFE3FF" android:pathData="M65,92m-3.4,0a3.4,3.4 0 1,1 6.8,0a3.4,3.4 0 1,1 -6.8,0" />
              <path android:fillColor="#B388FF" android:fillAlpha="0.28" android:pathData="M335,92m-7,0a7,7 0 1,1 14,0a7,7 0 1,1 -14,0" />
              <path android:fillColor="#EFE3FF" android:pathData="M335,92m-3.4,0a3.4,3.4 0 1,1 6.8,0a3.4,3.4 0 1,1 -6.8,0" />

              <!-- ২. জ্যামিতিক পাখি -->
              <group
                  android:scaleX="2.8"
                  android:scaleY="2.8"
                  android:translateX="95"
                  android:translateY="40">

                  <path android:fillColor="#1FB8A8" android:pathData="M17.323,39.3328C17.323,39.0671 30.993,37.5394 42.6953,36.2858C51.4128,35.3518 59.0469,34.5672 59.0469,34.5672C59.0469,34.5672 59.0469,51.4834 45.3479,57.0668C45.3479,57.0668 34.7706,61.0893 24.1767,53.1937C24.1767,53.1937 17.8834,48.5692 17.323,39.3328Z" />
                  <path android:fillColor="#FF6B4A" android:pathData="M42.6953,36.2858L63.8166,30.3952L56.8924,44.3391L42.6953,36.2858Z" />
                  <path android:fillColor="#FFC24B" android:pathData="M51.5955,23.0932C61.1433,21.304 63.8166,30.3952 63.8166,30.3952L42.6953,36.2858C42.8862,23.8487 51.5955,23.0932 51.5955,23.0932Z" />
                  <path android:fillColor="#12897D" android:pathData="M62.5713,25.8081L69.7653,22.5411L64.7175,29.731L62.5713,25.8081Z" />
                  <path android:fillColor="#B388FF" android:pathData="M9.2738,19.9632C9.2738,19.9632 8.3813,18.6223 9.2738,17.5762C9.6899,17.163 10.2525,16.9311 10.8388,16.9311C11.4252,16.9311 11.9878,17.163 12.4039,17.5762L30.2873,38.7474C30.2873,38.7474 31.4787,40.4079 30.2873,41.2797C30.2873,41.2797 29.0917,43.3553 26.2606,40.5366L9.2738,19.9632Z" />
