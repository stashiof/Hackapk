name: Ultimate App Modder 🚀

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'অ্যাপ কোথা থেকে ডাউনলোড করবেন?'
        required: true
        type: choice
        options:
          - 'PlayStore'
          - 'GoogleDrive'
        default: 'PlayStore'
      app_identifier:
        description: 'Play Store Package Name অথবা Google Drive Link'
        required: true
        type: string
        default: 'tech.shikho.android'
      unlock_premium:
        description: 'সব প্রিমিয়াম ফিচার আনলক করবেন?'
        required: true
        type: boolean
        default: true
      bypass_secure:
        description: 'স্ক্রিনশট/রেকর্ড রেস্ট্রিকশন ভাঙতে চান?'
        required: true
        type: boolean
        default: true
      change_name:
        description: 'অ্যাপের নাম পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      new_app_name:
        description: 'নতুন অ্যাপের নাম'
        required: false
        type: string
        default: 'Modded App'
      change_icon:
        description: 'অ্যাপের লোগো পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      icon_url:
        description: 'নতুন লোগোর লিংক (PNG)'
        required: false
        type: string
      clone_app:
        description: 'ক্লোন অ্যাপ তৈরি করবেন?'
        required: true
        type: boolean
        default: false

jobs:
  build_mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl zip unzip xmlstarlet jq
          pip install gdown pillow

          # Fail-safe Dynamic apkeep installer
          echo "Installing apkeep..."
          python3 - << 'PYEOF'
          import urllib.request, json, os, stat, tarfile, zipfile

          installed = False
          try:
              req = urllib.request.Request("https://api.github.com/repos/EFForg/apkeep/releases/latest", headers={"User-Agent": "Mozilla/5.0"})
              res = json.loads(urllib.request.urlopen(req).read().decode())
              for asset in res.get("assets", []):
                  name = asset.get("name", "")
                  if "x86_64" in name and ("linux" in name or "unknown-linux" in name):
                      url = asset.get("browser_download_url")
                      print(f"Downloading from: {url}")
                      urllib.request.urlretrieve(url, "apkeep_dl")
                      if name.endswith(".tar.gz") or name.endswith(".tgz"):
                          with tarfile.open("apkeep_dl", "r:gz") as tar:
                              tar.extractall(".")
                      elif name.endswith(".zip"):
                          with zipfile.ZipFile("apkeep_dl", "r") as z:
                              z.extractall(".")
                      else:
                          os.rename("apkeep_dl", "apkeep")
                      
                      if os.path.exists("apkeep"):
                          os.chmod("apkeep", stat.S_IRWXU | stat.S_IRGRP | stat.S_IXGRP | stat.S_IROTH | stat.S_IXOTH)
                          os.system("sudo mv apkeep /usr/local/bin/")
                          installed = True
                          break
          except Exception as e:
              print(f"API install error: {e}")

          if not installed:
              print("Fallback to cargo install...")
              os.system("cargo install apkeep")
          PYEOF

          # Verify apkeep binary
          apkeep --version || { echo "apkeep installation failed"; exit 1; }

          wget -q -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download & Merge APK
        run: |
          if [ "${{ github.event.inputs.source_type }}" == "PlayStore" ]; then
            echo "Downloading from Play Store..."
            mkdir -p downloaded_apks
            
            # Download with error capture
            apkeep -a "${{ github.event.inputs.app_identifier }}" downloaded_apks/ || true
            
            apks_file=$(find downloaded_apks -type f -name "*.apks" | head -n 1)
            xapk_file=$(find downloaded_apks -type f -name "*.xapk" | head -n 1)
            apk_count=$(find downloaded_apks -name "*.apk" | wc -l)
            
            if [ -n "$apks_file" ]; then
              java -jar APKEditor.jar m -i "$apks_file" -o universal.apk
            elif [ -n "$xapk_file" ]; then
              java -jar APKEditor.jar m -i "$xapk_file" -o universal.apk
            elif [ "$apk_count" -gt "1" ]; then
              cd downloaded_apks
              zip -q -r ../app.apks $(find . -name "*.apk")
              cd ..
              java -jar APKEditor.jar m -i app.apks -o universal.apk
            elif [ "$apk_count" -eq "1" ]; then
              find downloaded_apks -name "*.apk" -exec cp {} universal.apk \;
            else
              echo "::error::Play Store থেকে অ্যাপ নামানো যায়নি (GitHub Actions IP রেস্ট্রিকশন)। অ্যাপটি Google Drive-এ আপলোড করে লিঙ্ক দিন এবং GoogleDrive অপশন সিলেক্ট করুন।"
              exit 1
            fi
          else
            echo "Downloading from Google Drive..."
            gdown --fuzzy "${{ github.event.inputs.app_identifier }}" -O downloaded_drive_file
            
            if file downloaded_drive_file | grep -q "Zip"; then
              java -jar APKEditor.jar m -i downloaded_drive_file -o universal.apk || cp downloaded_drive_file universal.apk
            else
              mv downloaded_drive_file universal.apk
            fi
          fi

      - name: Decompile APK
        run: |
          echo "Decompiling APK..."
          java -jar apktool.jar d universal.apk -o decompiled_app -f

      - name: Premium Features Unlock (Crash-Free Precision Patch)
        if: ${{ github.event.inputs.unlock_premium == 'true' }}
        run: |
          echo "Applying Verified Smali Patches..."
          python3 - << 'EOF'
          import os, re

          target_files = [
              "slh.smali", "er6.smali", "zd6.smali", "tq6.smali", "sd6.smali",
              "n4.smali", "h7c.smali", "u7c.smali", "h30.smali", "b46.smali",
              "d43.smali", "lu5.smali", "d8c.smali", "m7c.smali"
          ]

          for root, dirs, files in os.walk("decompiled_app"):
              for file in files:
                  if file not in target_files: 
                      continue
                  filepath = os.path.join(root, file)
                  with open(filepath, "r", encoding="utf-8") as f:
                      c = f.read()
                  orig = c

                  # 1. slh.smali -> Force Intrinsics.areEqual to TRUE ("Full" match)
                  if file == "slh.smali":
                      c = re.sub(
                          r'(invoke-static \{[^\}]+\}, Loa8;->e\(Ljava/lang/Object;Ljava/lang/Object;\)Z\s+move-result ([vp]\d+))',
                          r'\1\n    const/4 \2, 0x1',
                          c
                      )
                      c = re.sub(
                          r'(iget-boolean ([vp]\d+), ([vp]\d+), Lz19;->o0:Z)',
                          r'\1\n    const/4 \2, 0x1',
                          c
                      )

                  # 2 & 3. er6.smali, zd6.smali -> Model parsers for access_level
                  elif file == "er6.smali":
                      c = c.replace('check-cast v4, Ljava/lang/String;', 'const-string v4, "Full"')
                  elif file == "zd6.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/String;', r'const-string \1, "Full"', c, count=1)

                  # 4 & 5. tq6.smali, sd6.smali -> Model Constructors
                  elif file == "tq6.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Ltq6;->a:Ljava/lang/String;',
                          r'const-string \1, "Full"\n    iput-object \1, \2, Ltq6;->a:Ljava/lang/String;',
                          c
                      )
                  elif file == "sd6.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lsd6;->a:Ljava/lang/String;',
                          r'const-string \1, "Full"\n    iput-object \1, \2, Lsd6;->a:Ljava/lang/String;',
                          c
                      )

                  # 6. n4.smali -> Academic Program Model
                  elif file == "n4.smali":
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->l:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->l:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->t:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->t:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->w:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->w:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->v:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->v:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->p:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->p:Z', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Ln4;->h:Ljava/lang/String;', r'const-string \1, "Full"\n    iput-object \1, \2, Ln4;->h:Ljava/lang/String;', c)

                  # 7 & 8. h7c.smali, u7c.smali -> Enrollment status models
                  elif file == "h7c.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->f:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->f:Ljava/lang/Boolean;',
                          c
                      )
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->g:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->g:Ljava/lang/Boolean;',
                          c
                      )
                  elif file == "u7c.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lu7c;->a:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lu7c;->a:Ljava/lang/Boolean;',
                          c
                      )

                  # 9. h30.smali -> AppPreference (Access level returning "Full")
                  elif file == "h30.smali":
                      c = re.sub(
                          r'\.method public final d\(\)Ljava/lang/String;.*?\.end method',
                          '.method public final d()Ljava/lang/String;\n    .registers 2\n    const-string v0, "Full"\n    return-object v0\n.end method',
                          c,
                          flags=re.DOTALL
                      )
                      c = re.sub(
                          r'\.method public final y\(\)I.*?\.end method',
                          '.method public final y()I\n    .registers 2\n    const v0, 0x7fffffff\n    return v0\n.end method',
                          c,
                          flags=re.DOTALL
                      )

                  # 10 & 12. b46.smali, lu5.smali -> Active subscription deserializers
                  elif file == "b46.smali":
                      c = c.replace('check-cast v6, Ljava/lang/Boolean;', 'sget-object v6, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                  elif file == "lu5.smali":
                      c = c.replace('check-cast v6, Ljava/lang/Boolean;', 'sget-object v6, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')

                  # 11. d43.smali -> Upcoming lesson access level setting
                  elif file == "d43.smali":
                      c = re.sub(
                          r'invoke-virtual \{([vp]\d+), ([vp]\d+)\}, Lh30;->C\(Ljava/lang/String;\)V',
                          r'const-string \2, "Full"\n    invoke-virtual {\1, \2}, Lh30;->C(Ljava/lang/String;)V',
                          c
                      )

                  # 13 & 14. d8c.smali, m7c.smali -> Enrollment Deserializers
                  elif file == "d8c.smali":
                      c = c.replace('check-cast v1, Ljava/lang/Boolean;', 'sget-object v1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                  elif file == "m7c.smali":
                      c = c.replace('check-cast v9, Ljava/lang/Boolean;', 'sget-object v9, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;')
                      c = c.replace('check-cast v10, Ljava/lang/Boolean;', 'sget-object v10, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;')

                  if c != orig:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(c)
                      print(f"-> Safely Patched {file}")
          EOF

      - name: Patch FLAG_SECURE (Screenshot/Record Enable)
        if: ${{ github.event.inputs.bypass_secure == 'true' }}
        run: |
          echo "Bypassing FLAG_SECURE..."
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/Landroid\/view\/Window;->setFlags(II)V/ s/^/# patched /' {} +
          find decompiled_app/smali* -type f -name "*.smali" -exec sed -i '/Landroid\/view\/Window;->addFlags(I)V/ s/^/# patched /' {} +

      - name: Change App Name
        if: ${{ github.event.inputs.change_name == 'true' }}
        run: |
          echo "Changing App Name..."
          find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.new_app_name }}<\/string>/g' {} +

      - name: Clone App
        if: ${{ github.event.inputs.clone_app == 'true' }}
        run: |
          echo "Cloning App..."
          MANIFEST="decompiled_app/AndroidManifest.xml"
          ORIGINAL_PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST" | head -n 1)
          if [ -n "$ORIGINAL_PKG" ]; then
            NEW_PKG="${ORIGINAL_PKG}.clone"
            sed -i "s/package=\"$ORIGINAL_PKG\"/package=\"$NEW_PKG\"/g" "$MANIFEST"
            sed -i "s/android:authorities=\"/android:authorities=\"clone./g" "$MANIFEST"
          fi

      - name: Change App Icon
        if: ${{ github.event.inputs.change_icon == 'true' }}
        run: |
          echo "Downloading and applying new Icon..."
          wget -q -O app_icon.png "${{ github.event.inputs.icon_url }}"
          
          python3 - << 'EOF'
          import os
          from PIL import Image
          
          icon_src = "app_icon.png"
          if not os.path.exists(icon_src):
              exit(0)
              
          for root, dirs, files in os.walk("decompiled_app/res"):
              if "anydpi" in root:
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".xml"):
                          try:
                              os.remove(os.path.join(root, f))
                          except:
                              pass
                          
          try:
              orig = Image.open(icon_src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": (48, 48), "mipmap-hdpi": (72, 72),
                  "mipmap-xhdpi": (96, 96), "mipmap-xxhdpi": (144, 144),
                  "mipmap-xxxhdpi": (192, 192), "drawable": (192, 192)
              }
              for folder, size in sizes.items():
                  dir_path = os.path.join("decompiled_app/res", folder)
                  if os.path.exists(dir_path):
                      resized = orig.resize(size, Image.Resampling.LANCZOS)
                      for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                          resized.save(os.path.join(dir_path, name), format="PNG", optimize=True)
          except Exception as e:
              print(f"Icon update error: {e}")
          EOF

      - name: Rebuild Optimized APK
        run: |
          echo "Rebuilding APK..."
          java -jar apktool.jar b decompiled_app -o modded_unsigned.apk --use-aapt2

      - name: Sign Modded APK
        run: |
          echo "Signing APK..."
          java -jar uber-apk-signer.jar -a modded_unsigned.apk -o output_signed/

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Modded-APK
          path: output_signed/*.apk
