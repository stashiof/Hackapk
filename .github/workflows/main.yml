      - name: Update Onboarding Images
        if: ${{ github.event.inputs.change_onboarding == 'true' }}
        run: |
          echo "Updating onboarding images..."
          python3 - << 'EOF'
          import os, re, urllib.request, gdown
          from PIL import Image

          def download_asset(url_str, out_path):
              if not url_str or not url_str.strip():
                  return False
              url = url_str.strip()
              # Google Drive Link / ID Detection
              if "drive.google.com" in url or (len(url) >= 25 and not url.startswith("http")):
                  match = re.search(r'[-\w]{25,}', url)
                  if match:
                      fid = match.group(0)
                      try:
                          gdown.download(id=fid, output=out_path, quiet=False)
                          if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                              return True
                      except Exception as e:
                          print(f"gdown id download failed: {e}")
                  try:
                      gdown.download(url=url, output=out_path, quiet=False)
                      if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                          return True
                  except Exception as e:
                      print(f"gdown direct download failed: {e}")

              # Direct HTTP / HTTPS Download
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp, open(out_path, 'wb') as f:
                      f.write(resp.read())
                  if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                      return True
              except Exception as e:
                  print(f"Direct download failed: {e}")
              return False

          targets = {
              "new_onboarding_img_1.png": """${{ github.event.inputs.onboarding_img_1 }}""",
              "new_onboarding_img_2.png": """${{ github.event.inputs.onboarding_img_2 }}""",
              "new_onboarding_img_3.png": """${{ github.event.inputs.onboarding_img_3 }}"""
          }

          res_root = "decompiled_app/res"
          os.makedirs("temp_onboarding", exist_ok=True)

          for filename, raw_url in targets.items():
              if not raw_url.strip():
                  continue
              temp_file = os.path.join("temp_onboarding", filename)
              print(f"Downloading onboarding image for {filename}...")
              if download_asset(raw_url, temp_file):
                  try:
                      img = Image.open(temp_file).convert("RGBA")
                      img.save(temp_file, format="PNG", optimize=True)
                      
                      replaced = False
                      for root, dirs, files in os.walk(res_root):
                          if "drawable" in os.path.basename(root):
                              for f in files:
                                  if f == filename:
                                      target_path = os.path.join(root, f)
                                      img.save(target_path, format="PNG", optimize=True)
                                      print(f"Replaced: {target_path}")
                                      replaced = True
                      if not replaced:
                          fallback = os.path.join(res_root, "drawable", filename)
                          os.makedirs(os.path.dirname(fallback), exist_ok=True)
                          img.save(fallback, format="PNG", optimize=True)
                          print(f"Created fallback: {fallback}")
                  except Exception as e:
                      print(f"Image processing error for {filename}: {e}")
          EOF

      - name: Change App Icon (Universal Drive & Web Downloader)
        if: ${{ github.event.inputs.change_icon == 'true' }}
        run: |
          echo "Downloading and applying new Icon..."
          python3 - << 'EOF'
          import os, re, urllib.request, gdown
          from PIL import Image

          def download_asset(url_str, out_path):
              url = url_str.strip()
              if "drive.google.com" in url or (len(url) >= 25 and not url.startswith("http")):
                  match = re.search(r'[-\w]{25,}', url)
                  if match:
                      fid = match.group(0)
                      try:
                          gdown.download(id=fid, output=out_path, quiet=False)
                          if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                              return True
                      except Exception as e:
                          print(f"Drive download failed: {e}")
                  try:
                      gdown.download(url=url, output=out_path, quiet=False)
                      if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                          return True
                  except Exception as e:
                      print(f"Drive direct download failed: {e}")

              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp, open(out_path, 'wb') as f:
                      f.write(resp.read())
                  if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                      return True
              except Exception as e:
                  print(f"Direct download failed: {e}")
              return False

          icon_url = """${{ github.event.inputs.icon_url }}""".strip()
          icon_src = "app_icon.png"

          if not download_asset(icon_url, icon_src):
              print("Icon could not be downloaded. Skipping icon replacement.")
              exit(0)

          for root, dirs, files in os.walk("decompiled_app/res"):
              if "anydpi" in root:
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".xml"):
                          try:
                              os.remove(os.path.join(root, f))
                          except:
                              pass

          try:
              orig = Image.open(icon_src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": (48, 48), "mipmap-hdpi": (72, 72),
                  "mipmap-xhdpi": (96, 96), "mipmap-xxhdpi": (144, 144),
                  "mipmap-xxxhdpi": (192, 192), "drawable": (192, 192)
              }
              for folder, size in sizes.items():
                  dir_path = os.path.join("decompiled_app/res", folder)
                  if os.path.exists(dir_path):
                      resized = orig.resize(size, Image.Resampling.LANCZOS)
                      for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                          resized.save(os.path.join(dir_path, name), format="PNG", optimize=True)
              print("-> Icon replaced successfully across all density folders.")
          except Exception as e:
              print(f"Icon update error: {e}")
          EOF

      - name: Inject Welcome & Disclaimer Dialog
        if: ${{ github.event.inputs.add_welcome_dialog == 'true' }}
        run: |
          echo "Injecting Custom Welcome Dialog..."
          python3 - << 'EOF'
          import os, re
          import xml.etree.ElementTree as ET

          manifest_path = "decompiled_app/AndroidManifest.xml"
          if not os.path.exists(manifest_path):
              print("AndroidManifest.xml not found. Aborting dialog injection.")
              exit(0)

          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          pkg = root.attrib.get('package', '')
          ver_name = root.attrib.get('{http://schemas.android.com/apk/res/android}versionName', '1.0.0')

          launcher_activity = None
          for activity in root.findall('.//activity'):
              for intent_filter in activity.findall('intent-filter'):
                  has_main = False
                  has_launcher = False
                  for action in intent_filter.findall('action'):
                      if action.attrib.get('{http://schemas.android.com/apk/res/android}name') == 'android.intent.action.MAIN':
                          has_main = True
                  for category in intent_filter.findall('category'):
                      if category.attrib.get('{http://schemas.android.com/apk/res/android}name') == 'android.intent.category.LAUNCHER':
                          has_launcher = True
                  if has_main and has_launcher:
                      launcher_activity = activity.attrib.get('{http://schemas.android.com/apk/res/android}name')
                      break
              if launcher_activity:
                  break

          if not launcher_activity:
              print("Could not detect launcher activity.")
              exit(0)

          if launcher_activity.startswith('.'):
              full_launcher_class = pkg + launcher_activity
          elif '.' not in launcher_activity:
              full_launcher_class = pkg + '.' + launcher_activity
          else:
              full_launcher_class = launcher_activity

          print(f"Target Launcher Activity: {full_launcher_class}")

          smali_relative_path = full_launcher_class.replace('.', '/') + ".smali"
          target_smali_file = None

          for s_dir in [d for d in os.listdir("decompiled_app") if d.startswith("smali")]:
              cand = os.path.join("decompiled_app", s_dir, smali_relative_path)
              if os.path.exists(cand):
                  target_smali_file = cand
                  break

          if not target_smali_file:
              simple_name = full_launcher_class.split('.')[-1] + ".smali"
              for r, d, files in os.walk("decompiled_app"):
                  if simple_name in files:
                      target_smali_file = os.path.join(r, simple_name)
                      break

          if not target_smali_file:
              print(f"Could not find smali file for {full_launcher_class}")
              exit(0)

          print(f"Injecting hook into: {target_smali_file}")

          # Dialog Smali ফাইলসমূহ তৈরি করা
          helper_dir = os.path.join("decompiled_app", "smali", "com", "mod", "helper")
          os.makedirs(helper_dir, exist_ok=True)

          author_name = """${{ github.event.inputs.mod_author }}""".strip() or "Fahim"
          app_title = """${{ github.event.inputs.new_app_name }}""".strip() if "${{ github.event.inputs.change_name }}" == "true" else "Shikho Modded"

          dialog_msg = (
              f"অ্যাপ সংস্করণ: v{ver_name}\\n"
              f"মোডার / ডেভেলপার: {author_name}\\n"
              f"উদ্দেশ্য: ব্যক্তিগত শিক্ষা ও গবেষণার জন্য তৈরি\\n\\n"
              f"• এই অ্যাপ্লিকেশনটি ব্যবহারের ফলে কোনো ডিভাইসে সমস্যা, ডেটা লস বা যেকোনো ধরণের ঝুঁকির সম্পূর্ণ দায় ব্যবহারকারীর নিজের।\\n"
              f"• এই APK ব্যবহারের কোনো দায় আমি বা ডেভেলপার নিব না।\\n\\n"
              f"আপনি যদি সকল শর্তে রাজি থাকেন, তবে নিচের 'READ AND AGREE' বাটনে চাপুন।"
          )

          welcome_smali = f""".class public Lcom/mod/helper/WelcomeDialog;
          .super Ljava/lang/Object;

          .method public constructor <init>()V
              .registers 1
              invoke-direct {{p0}}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          .method public static show(Landroid/app/Activity;)V
              .registers 8

              if-nez p0, :cond_exit

              const-string v0, "mod_dialog_pref"
              const/4 v1, 0x0
              invoke-virtual {{p0, v0, v1}}, Landroid/content/Context;->getSharedPreferences(Ljava/lang/String;I)Landroid/content/SharedPreferences;
              move-result-object v0

              const-string v2, "agreed_disclaimer"
              invoke-interface {{v0, v2, v1}}, Landroid/content/SharedPreferences;->getBoolean(Ljava/lang/String;Z)Z
              move-result v1

              if-eqz v1, :cond_show
              return-void

              :cond_show
              new-instance v1, Landroid/app/AlertDialog$Builder;
              invoke-direct {{v1, p0}}, Landroid/app/AlertDialog$Builder;-><init>(Landroid/content/Context;)V

              const-string v2, "স্বাগতম — {app_title}"
              invoke-virtual {{v1, v2}}, Landroid/app/AlertDialog$Builder;->setTitle(Ljava/lang/CharSequence;)Landroid/app/AlertDialog$Builder;

              const-string v2, "{dialog_msg}"
